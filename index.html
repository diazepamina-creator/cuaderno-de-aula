<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuaderno de aula</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1D3A8A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ── Cuaderno de aula ─────────────────────────────────────────────────────
   Un cuaderno de profesor de matemáticas: papel cuadriculado, tinta de
   bolígrafo azul, el rojo de corregir, y cada grupo subrayado con el color
   que tiene en el horario del centro. */
:root{
  --papel:#FBFCFD; --cuad:#DDE7F1; --tinta:#1D3A8A; --grafito:#262A31;
  --gris:#687180; --linea:#C8D5E2; --rojo:#C8322B; --hoja:#FFFFFF;
  --sombra:0 1px 0 rgba(29,58,138,.08), 0 6px 18px -10px rgba(29,58,138,.35);
  --g1A:#D2CE5C; --g1B:#6BB3EE; --g1D:#F59C63; --g2B:#44C35A; --gR4:#3BBDB7; --gX:#C9CED6;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --papel:#11151B; --cuad:#1A212B; --tinta:#93B2FF; --grafito:#E7EAEF;
    --gris:#9AA4B2; --linea:#2B3542; --rojo:#FF7064; --hoja:#171C24;
    --sombra:0 1px 0 rgba(0,0,0,.4), 0 8px 20px -12px rgba(0,0,0,.8);
    --g1A:#A9A640; --g1B:#3F86C2; --g1D:#C9763F; --g2B:#2E9A42; --gR4:#23928D; --gX:#4A5360;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --papel:#11151B; --cuad:#1A212B; --tinta:#93B2FF; --grafito:#E7EAEF;
  --gris:#9AA4B2; --linea:#2B3542; --rojo:#FF7064; --hoja:#171C24;
  --sombra:0 1px 0 rgba(0,0,0,.4), 0 8px 20px -12px rgba(0,0,0,.8);
  --g1A:#A9A640; --g1B:#3F86C2; --g1D:#C9763F; --g2B:#2E9A42; --gR4:#23928D; --gX:#4A5360;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.45;color:var(--grafito);
  background-color:var(--papel);
  background-image:linear-gradient(var(--cuad) 1px,transparent 1px),linear-gradient(90deg,var(--cuad) 1px,transparent 1px);
  background-size:22px 22px;
  min-height:100vh;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--tinta);outline-offset:2px;border-radius:6px}
.app{max-width:680px;margin:0 auto;padding:14px 16px 110px}

/* cabecera: la fecha es lo grande, escrita en tinta */
.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 4px}
.fecha{color:var(--tinta);line-height:1.05}
.fecha .dia{font-size:15px;font-weight:700;display:block;margin-bottom:2px}
.fecha .num{font-size:44px;font-weight:700;letter-spacing:-.5px}
.fecha .mes{font-size:22px;font-weight:400;margin-left:6px}
.nav{display:flex;gap:6px}
.btn-r{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--linea);background:var(--hoja);
  display:grid;place-items:center;color:var(--tinta);font-size:22px;line-height:1}
.hoy{height:44px;padding:0 14px;border-radius:22px;border:1.5px solid var(--tinta);background:var(--hoja);color:var(--tinta);font-weight:700}
.estado-sync{font-size:13px;color:var(--gris);margin:0 0 12px}
.estado-sync b{color:var(--grafito);font-weight:700}

.aviso{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--hoja);border:1.5px solid var(--rojo);color:var(--rojo);
  border-radius:12px;padding:10px 12px;margin:8px 0 14px;font-weight:700;width:100%;text-align:left}
.aviso small{font-weight:400;color:var(--gris);display:block}
.aviso.copia{background:var(--tinta);border-color:var(--tinta);color:var(--hoja)}
.aviso.copia small{color:var(--hoja);opacity:.85}
.barras{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--linea);margin:6px 0 2px}
.barras span{display:block;height:100%}
.leyenda{font-size:13px;color:var(--gris)}
.unidad{margin-bottom:10px}
.unidad .n{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.prog{height:8px;border-radius:4px;background:var(--linea);overflow:hidden;margin-top:4px}
.prog span{display:block;height:100%;background:var(--tinta)}
.prox{list-style:none;margin:0 0 14px;padding:0}
.prox button{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;
  background:var(--hoja);border:1px solid var(--linea);border-radius:12px;padding:9px 12px;margin-bottom:6px}
.prox .cuando{font-weight:700;color:var(--tinta);font-size:15px;min-width:64px}
.prox .cuando.cerca{color:var(--rojo)}
.prox .que{font-size:15px}
.prox .que small{display:block;color:var(--gris);font-size:13px}
.etq{display:inline-block;font-size:12px;font-weight:700;color:var(--rojo);border:1.5px solid var(--rojo);
  border-radius:10px;padding:0 6px;margin-left:6px;line-height:18px;vertical-align:1px}
.ev{background:var(--hoja);border:1px solid var(--linea);border-radius:12px;padding:10px 12px;margin-bottom:8px;width:100%;text-align:left}
.ev h4{margin:0 0 4px;font-size:16px}
.ev .t{font-size:13px;color:var(--gris)}
.ev ul{list-style:none;margin:6px 0 0;padding:0}
.ev li{font-size:14px;margin:3px 0}
.g-fecha{display:grid;grid-template-columns:120px 1fr;gap:8px;align-items:center;margin-top:8px}
.recons{border:1px dashed var(--gris);border-radius:12px;padding:10px 12px;background:var(--hoja)}
.registro{font-size:13px;color:var(--gris);margin:18px 0 0;border-top:1px dashed var(--linea);padding-top:10px}
.u-fila{display:grid;grid-template-columns:1fr 70px 40px;gap:6px;margin-bottom:6px;align-items:center}
.u-fila button{height:40px;border:0;background:none;color:var(--rojo);font-size:20px}

/* las franjas: renglones del día */
.franjas{list-style:none;margin:0;padding:0}
.fr{display:grid;grid-template-columns:62px 1fr auto;align-items:center;gap:10px;
  background:var(--hoja);border:1px solid var(--linea);border-radius:12px;padding:10px 12px;margin-bottom:8px;
  width:100%;text-align:left;box-shadow:var(--sombra)}
.fr.otra{box-shadow:none;background:transparent;border-style:dashed}
.fr.ahora{border:2px solid var(--tinta)}
.hora{font-variant-numeric:tabular-nums;font-size:14px;color:var(--gris);line-height:1.2}
.hora b{display:block;color:var(--grafito);font-size:16px}
.grupo{font-weight:700;font-size:18px;display:inline;padding:0 3px;
  background:linear-gradient(transparent 52%,var(--gc,var(--gX)) 52%,var(--gc,var(--gX)) 92%,transparent 92%)}
.sub{font-size:14px;color:var(--gris);margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.marca{font-size:13px;font-weight:700;white-space:nowrap}
.marca.ok{color:var(--tinta)}
.marca.pend{color:var(--rojo)}
.marca.no{color:var(--gris);text-decoration:line-through}
.recreo{font-size:13px;color:var(--gris);text-align:center;margin:2px 0 10px;letter-spacing:.3px}
.pt{display:inline-block;font-size:12px;font-weight:700;color:var(--tinta);border:1.5px solid var(--tinta);
  border-radius:10px;padding:0 6px;margin-left:6px;line-height:18px;vertical-align:1px}
.vacio{background:var(--hoja);border:1px solid var(--linea);border-radius:12px;padding:18px;text-align:center;color:var(--gris)}
.vacio b{color:var(--grafito)}

/* barra inferior */
.barra{position:fixed;left:0;right:0;bottom:0;background:var(--hoja);border-top:1px solid var(--linea);
  padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.barra nav{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.barra button{background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:13px;color:var(--gris)}
.barra button[aria-current="page"]{color:var(--tinta);font-weight:700}
.barra svg{width:24px;height:24px}

/* la hoja de la sesión */
.velo{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:10;display:none}
.velo.abierto{display:block}
.hoja{position:fixed;left:0;right:0;bottom:0;top:0;z-index:11;background:var(--papel);
  overflow:auto;transform:translateY(100%);transition:transform .22s ease-out;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.hoja.abierta{transform:none}
@media (prefers-reduced-motion: reduce){.hoja{transition:none}}
.hoja-in{max-width:680px;margin:0 auto;padding:12px 16px 120px}
.hoja-cab{position:sticky;top:0;background:var(--papel);padding:10px 0 10px;z-index:2;
  display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--linea)}
.hoja-cab h2{margin:0;font-size:20px;color:var(--tinta)}
.hoja-cab .quando{font-size:14px;color:var(--gris)}
.cerrar{height:44px;padding:0 14px;border-radius:22px;border:1.5px solid var(--linea);background:var(--hoja)}
.campo{margin:16px 0}
.campo > label,.campo > .et{display:block;font-weight:700;margin-bottom:6px}
.campo .ayuda{font-size:14px;color:var(--gris);font-weight:400}
textarea,input[type=text],input[type=date],input[type=number]{
  width:100%;border:1.5px solid var(--linea);background:var(--hoja);border-radius:10px;padding:10px 12px;font-size:17px}
textarea{min-height:84px;resize:vertical}
textarea:focus,input:focus{border-color:var(--tinta);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1.5px solid var(--linea);background:var(--hoja);border-radius:18px;padding:6px 12px;font-size:15px}
.chip.igual{border-color:var(--tinta);color:var(--tinta)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1.5px solid var(--linea);background:var(--hoja);border-radius:10px;padding:10px 6px;font-size:15px;line-height:1.2}
.seg button[aria-pressed="true"]{border-color:var(--tinta);background:var(--tinta);color:var(--hoja);font-weight:700}
.seg.dos{grid-template-columns:repeat(2,1fr)}
.deber{border:1px solid var(--linea);background:var(--hoja);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.deber-cab{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.deber-cab p{margin:0}
.deber-cab .de{font-size:13px;color:var(--gris)}
.tog{border:1.5px solid var(--linea);background:var(--hoja);border-radius:18px;padding:6px 12px;font-size:14px;white-space:nowrap}
.tog[aria-pressed="true"]{border-color:var(--tinta);color:var(--tinta);font-weight:700}
.lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin-top:10px}
.lista button{height:42px;border:1.5px solid var(--linea);background:var(--hoja);border-radius:8px;font-variant-numeric:tabular-nums;font-size:16px}
.lista button[aria-pressed="true"]{border-color:var(--rojo);background:var(--rojo);color:#fff;font-weight:700}
.lista-nota{font-size:13px;color:var(--gris);margin-top:6px}
details{border:1px dashed var(--linea);border-radius:12px;padding:8px 12px;background:var(--hoja)}
summary{font-weight:700;cursor:pointer;padding:4px 0}
.acciones{position:fixed;left:0;right:0;bottom:0;background:var(--hoja);border-top:1px solid var(--linea);z-index:12;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.acciones div{max-width:680px;margin:0 auto;display:flex;gap:10px}
.primario{flex:1;height:50px;border-radius:12px;border:0;background:var(--tinta);color:var(--hoja);font-weight:700;font-size:18px}
.secundario{height:50px;border-radius:12px;border:1.5px solid var(--linea);background:var(--hoja);padding:0 16px}
.peligro{color:var(--rojo);border-color:var(--rojo)}

/* grupos */
h1.titulo{font-size:28px;color:var(--tinta);margin:8px 0 12px;line-height:1.1}
.sel-grupo{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.sel-grupo button{border:1.5px solid var(--linea);background:var(--hoja);border-radius:20px;padding:8px 14px;font-weight:700}
.sel-grupo button[aria-pressed="true"]{border-color:var(--grafito);box-shadow:inset 0 -6px 0 var(--gc)}
.cifras{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.cifra{background:var(--hoja);border:1px solid var(--linea);border-radius:12px;padding:10px}
.cifra b{display:block;font-size:26px;color:var(--tinta);font-variant-numeric:tabular-nums;line-height:1.1}
.cifra span{font-size:13px;color:var(--gris)}
h3{font-size:17px;margin:18px 0 8px}
.hist{list-style:none;margin:0;padding:0}
.hist button{width:100%;text-align:left;background:var(--hoja);border:1px solid var(--linea);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.hist .f{font-size:13px;color:var(--gris);font-variant-numeric:tabular-nums}
.hist .c{margin:2px 0 0}
.hist .d{font-size:14px;color:var(--tinta);margin-top:4px}
.hist .r{font-size:14px;color:var(--rojo);margin-top:2px}

/* exportar y ajustes */
.panel{background:var(--hoja);border:1px solid var(--linea);border-radius:12px;padding:14px;margin-bottom:14px}
.panel p{margin:0 0 10px}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.checks label{display:flex;align-items:center;gap:6px;border:1.5px solid var(--linea);border-radius:18px;padding:6px 12px}
.bloque-btn{display:block;width:100%;margin-top:10px;height:50px;border-radius:12px;border:1.5px solid var(--tinta);
  background:var(--hoja);color:var(--tinta);font-weight:700;font-size:16px}
.bloque-btn.lleno{background:var(--tinta);color:var(--hoja)}
.alumnos{display:grid;grid-template-columns:1fr 90px;gap:8px;align-items:center}
.nolect{list-style:none;padding:0;margin:8px 0 0}
.nolect li{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--linea)}
.nolect button{border:0;background:none;color:var(--rojo);font-weight:700}
.nota{font-size:14px;color:var(--gris)}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--grafito);color:var(--papel);padding:10px 16px;border-radius:22px;font-size:15px;z-index:20;
  opacity:0;pointer-events:none;transition:opacity .2s}
.toast.si{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="app" id="app"></div>

<div class="velo" id="velo"></div>
<section class="hoja" id="hoja" aria-modal="true" role="dialog" aria-labelledby="hoja-titulo"></section>

<div class="barra"><nav id="barra" aria-label="Secciones">
  <button data-v="dia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>Día</button>
  <button data-v="grupos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Grupos</button>
  <button data-v="exportar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/></svg>Exportar</button>
  <button data-v="fechas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M8 3v4M16 3v4M12 11v4M12 17.6v.2"/></svg>Fechas</button>
  <button data-v="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M4.2 7.5l2 1.2M17.8 15.3l2 1.2M4.2 16.5l2-1.2M17.8 8.7l2-1.2"/></svg>Ajustes</button>
</nav></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ═══════════════════════════ DATOS FIJOS ═══════════════════════════ */
const FRANJAS = [
  {n:1, ini:'8:15',  fin:'9:10'},
  {n:2, ini:'9:10',  fin:'10:05'},
  {n:3, ini:'10:05', fin:'11:00'},
  {recreo:true},
  {n:4, ini:'11:25', fin:'12:20'},
  {n:5, ini:'12:20', fin:'13:15'},
  {n:6, ini:'13:15', fin:'14:10'},
];
const FR = Object.fromEntries(FRANJAS.filter(f=>f.n).map(f=>[f.n,f]));
const GRUPOS = {
  '1A':{nombre:'1.º ESO A', nivel:1},
  '1B':{nombre:'1.º ESO B', nivel:1},
  '1D':{nombre:'1.º ESO D', nivel:1},
  '2B':{nombre:'2.º ESO B', nivel:2},
  'R4':{nombre:'Refuerzo 4.º ESO', nivel:4},
};
const OTRAS = {G:'Guardia', C:'Complementarias', RM:'Reunión de departamento', AF:'Atención a familias'};
// HORARIO[día de la semana 1..5][franja] — del horario del centro.
// pt: sesión con la PT en el aula (POR6 en el horario; solo en 1.º A y 1.º B).
const HORARIO = {
  1:{1:{g:'1B',aula:'A114'}, 2:{g:'1A',aula:'A114',pt:true}, 3:{o:'C'}},
  2:{3:{g:'1D',aula:'A100'}, 4:{g:'1A',aula:'A114'}, 5:{g:'1B',aula:'A114',pt:true}, 6:{g:'2B',aula:'A114'}},
  3:{1:{o:'G'}, 2:{g:'1D',aula:'A104'}, 3:{o:'RM'}, 4:{g:'2B',aula:'A100'}, 5:{o:'AF'}, 6:{g:'R4',aula:'A200'}},
  4:{1:{g:'2B',aula:'A100'}, 2:{g:'1B',aula:'A100',pt:true}, 3:{o:'G'}, 4:{g:'1A',aula:'A100',pt:true}, 5:{g:'1D',aula:'A100'}, 6:{o:'C'}},
  5:{1:{g:'2B',aula:'A100'}, 2:{o:'G'}, 3:{g:'1D',aula:'A100'}, 4:{g:'R4',aula:'A114'}, 5:{g:'1A',aula:'A114'}, 6:{g:'1B',aula:'A114'}},
};
const CLIMA = {bien:'Se ha podido trabajar', regular:'A ratos', mal:'No se ha podido'};
const MOTIVOS = ['Festivo','Excursión o actividad','Ausencia del docente','Examen de otra materia','Otro'];
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

/* ═══════════════════════════ FECHAS ═══════════════════════════ */
const pad = n => String(n).padStart(2,'0');
const clave = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const deClave = k => { const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); };
const masDias = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const corta = k => { const d=deClave(k); return `${DIAS[d.getDay()].slice(0,3)} ${d.getDate()}/${d.getMonth()+1}`; };
const larga = k => { const d=deClave(k); return `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`; };
const minutos = h => { const [a,b]=h.split(':').map(Number); return a*60+b; };
const ahoraMin = () => { const n=new Date(); return n.getHours()*60+n.getMinutes(); };
const hoyK = () => clave(new Date());
const idSes = (fecha,n) => `${fecha}_${n}`;

/* ═══════════════════════════ ALMACÉN ═══════════════════════════
   Todo se guarda en el propio móvil (localStorage). No sale a ningún
   servidor: la copia de seguridad se hace a mano, desde Exportar, y se

// Cada registro guarda cuándo se creó y un historial de qué campos se
// cambiaron y cuándo: es lo que pide una auditoría para fiarse de un
// registro que se puede editar.
const CAMPOS = ['estado','motivo','unidad','contenido','material','deberes','revisiones','clima','pt','ptNotas','cambio','observacion','notas','reconstruido','fuente'];
function guardarSesion(id, datos){
  const ahora = new Date().toISOString(), prev = store.ses[id];
  const hist = prev ? clon(prev.historial||[]) : [];
  if(prev){
    const c = CAMPOS.filter(k => JSON.stringify(prev[k]??'') !== JSON.stringify(datos[k]??''));
    if(!c.length) return false;
    hist.push({t:ahora, c});
  }
  datos.creado = prev ? (prev.creado || prev.actualizado || ahora) : ahora;
  datos.historial = hist.slice(-30);
  datos.actualizado = ahora;
  store.ses[id] = datos; guardarLocal(); return true;
}
function borrarSesion(id){
  const s = store.ses[id];
  if(s) store.cfg.borrados.push({id, grupo:s.grupo||s.otra, fecha:s.fecha, franja:s.franja, t:new Date().toISOString(),
    resumen:(s.contenido||s.motivo||s.notas||'').slice(0,80)});
  delete store.ses[id]; guardarLocal();
}
function guardarCfg(){ guardarLocal(); }

}

/* ═══════════════════════════ LÓGICA ═══════════════════════════ */
function esLectivo(k){
  const d = deClave(k), w = d.getDay();
  return w>=1 && w<=5 && !store.cfg.nolectivos.includes(k);
}
function franjasDe(k){
  const w = deClave(k).getDay();
  return HORARIO[w] || {};
}
function haTerminado(k,n){
  const h = hoyK();
  if(k < h) return true;
  if(k > h) return false;
  return ahoraMin() >= minutos(FR[n].fin);
}
function sinRegistrar(){
  const out = [];
  const hoy = hoyK();
  let d = deClave(store.cfg.inicio || hoy);
  const fin = deClave(hoy);
  while(d <= fin){
    const k = clave(d);
    if(esLectivo(k)){
      const h = franjasDe(k);
      for(const n in h){
        if(h[n].g && haTerminado(k, Number(n)) && !store.ses[idSes(k,n)]) out.push({k, n:Number(n), g:h[n].g});
      }
    }
    d = masDias(d,1);
  }
  return out;
}
function sesionesDe(g){
  return Object.entries(store.ses).filter(([,s])=>s.grupo===g).sort((a,b)=>a[0]<b[0]?-1:1);
}
// deberes puestos antes de «actual» que no se han revisado en otra sesión
function deberesPendientes(g, actual){
  const revisados = new Set();
  for(const [id,s] of Object.entries(store.ses)){
    if(id===actual) continue;
    (s.revisiones||[]).forEach(r=>revisados.add(r.de));
  }
  return sesionesDe(g).filter(([id,s])=> id<actual && s.deberes && s.deberes.trim() && !revisados.has(id));
}
function igualQue(g, actual){
  const nivel = GRUPOS[g].nivel, out = [];
  for(const og of Object.keys(GRUPOS)){
    if(og===g || GRUPOS[og].nivel!==nivel) continue;
    const ult = sesionesDe(og).filter(([id,s])=>s.estado!=='no' && (s.contenido||'').trim()).pop();
    if(ult) out.push({g:og, id:ult[0], s:ult[1]});
  }
  return out;
}

// El «momento de copia» más reciente que ya ha pasado (p. ej. el último viernes a las 14:10)
function momentoCopia(){
  const {dia:dc, hora} = store.cfg.copia, [hh,mm] = hora.split(':').map(Number), now = new Date();
  const d = new Date(now); d.setHours(hh, mm, 0, 0);
  d.setDate(d.getDate() - ((d.getDay() - dc + 7) % 7));
  if(d > now) d.setDate(d.getDate() - 7);
  return d;
}
function tocaCopia(){
  if(!Object.keys(store.ses).length) return false;
  const u = store.cfg.ultimaCopiaT ? new Date(store.cfg.ultimaCopiaT) : null;
  return !u || u < momentoCopia();
}
const unidadesDe = g => store.cfg.unidades[GRUPOS[g].nivel] || [];
const nombreUnidad = (g, id) => (unidadesDe(g).find(u=>u.id===id)||{}).nombre || '';
function ultimaUnidad(g){
  const s = sesionesDe(g).filter(([,s])=>s.unidad).pop();
  return s ? s[1].unidad : '';
}
// Indicadores de un grupo entre dos fechas
function indicadores(g, desde, hasta){
  const hoy = hoyK(), ini = desde > store.cfg.inicio ? desde : store.cfg.inicio, fin = hasta < hoy ? hasta : hoy;
  let previstas = 0, conPT = 0;
  for(let d = deClave(ini); clave(d) <= fin; d = masDias(d,1)){
    const k = clave(d); if(!esLectivo(k)) continue;
    const h = franjasDe(k);
    for(const n in h) if(h[n].g===g && haTerminado(k, Number(n))) previstas++;
  }
  const ses = sesionesDe(g).map(([,s])=>s).filter(s=>s.fecha>=desde && s.fecha<=hasta);
  const dadas = ses.filter(s=>s.estado!=='no');
  const N = store.cfg.alumnos[g] || 25;
  let revisadas = 0, traen = 0, total = 0;
  dadas.forEach(s=>(s.revisiones||[]).forEach(r=>{ revisadas++; total += N; traen += N - (r.no||[]).length; }));
  const clima = {bien:0, regular:0, mal:0};
  dadas.forEach(s=>{ if(clima[s.clima]!==undefined) clima[s.clima]++; });
  const pt = dadas.filter(s=>s.pt); const ptSi = pt.filter(s=>s.pt!=='no').length;
  const porUnidad = unidadesDe(g).map(u=>({...u, dadas: dadas.filter(s=>s.unidad===u.id).length}));
  const sinUnidad = dadas.filter(s=>!s.unidad).length;
  return {previstas, registradas: ses.filter(s=>s.fecha<=fin).length, dadas: dadas.length, noDadas: ses.length - dadas.length,
    sinRegistrar: sinRegistrar().filter(x=>x.g===g && x.k>=desde && x.k<=hasta).length,
    puestos: dadas.filter(s=>s.deberes && s.deberes.trim()).length, revisadas,
    entrega: total ? Math.round(100*traen/total) : null, clima, climaN: clima.bien+clima.regular+clima.mal,
    pt: pt.length, ptSi, porUnidad, sinUnidad};
}
// Clima por franja horaria, sumando todos los grupos
function climaPorFranja(desde, hasta){
  const out = {};
  for(const n of [1,2,3,4,5,6]) out[n] = {bien:0, regular:0, mal:0};
  Object.values(store.ses).forEach(s=>{ if(s.grupo && s.estado!=='no' && s.clima && s.fecha>=desde && s.fecha<=hasta) out[s.franja][s.clima]++; });
  return out;
}
const pct = (a,b) => b ? Math.round(100*a/b) : 0;
const fechaHora = iso => { if(!iso) return ''; const d = new Date(iso); return `${d.getDate()}/${d.getMonth()+1} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };

/* Fechas previstas: pruebas escritas, entregas… Una misma prueba puede tener
   una fecha distinta en cada grupo (los tres primeros no tienen clase el
   mismo día). Se guardan en store.ev y van en la copia de seguridad. */
const TIPOS = {examen:'Prueba escrita', entrega:'Entrega', otro:'Otra fecha'};
const FUENTES = ['Aules','Fichas entregadas','Programación','Cuaderno en papel','Memoria'];
const diasHasta = k => Math.round((deClave(k) - deClave(hoyK())) / 86400000);
// clases de un grupo que quedan antes de una fecha (sin contar las de hoy ya terminadas)
function clasesAntes(g, k){
  let n = 0;
  for(let d = deClave(hoyK()); clave(d) < k; d = masDias(d,1)){
    const c = clave(d); if(!esLectivo(c)) continue;
    const h = franjasDe(c);
    for(const f in h) if(h[f].g===g && !haTerminado(c, Number(f))) n++;
  }
  return n;
}
function siguienteClase(g, desde){
  let d = deClave(desde);
  for(let i=0; i<90; i++, d = masDias(d,1)){
    const k = clave(d); if(!esLectivo(k)) continue;
    const h = franjasDe(k); for(const f in h) if(h[f].g===g) return k;
  }
  return desde;
}
function proximas(dias){
  const out = [];
  for(const [id,e] of Object.entries(store.ev||{})) for(const [g,k] of Object.entries(e.fechas||{})){
    const falta = diasHasta(k);
    if(falta>=0 && (dias===undefined || falta<=dias)) out.push({id, g, k, falta, tipo:e.tipo, titulo:e.titulo});
  }
  return out.sort((a,b)=> a.k<b.k ? -1 : a.k>b.k ? 1 : a.g<b.g ? -1 : 1);
}
const fechasDe = (g, k) => Object.values(store.ev||{}).filter(e=>e.fechas && e.fechas[g]===k);
function cuenta(x){
  if(x.falta===0) return 'hoy';
  if(x.falta===1) return 'mañana';
  const c = clasesAntes(x.g, x.k);
  return `faltan ${x.falta} días · ${c===0?'no te quedan clases antes':c===1?'te queda 1 clase antes':'te quedan '+c+' clases antes'}`;
}

function vFechas(){
  const hoy = hoyK();
  const evs = Object.entries(store.ev||{}).map(([id,e])=>{
    const ks = Object.values(e.fechas||{}).sort(); return {id, e, primera: ks[0]||'', ultima: ks[ks.length-1]||''};
  });
  const futuras = evs.filter(x=>x.ultima>=hoy).sort((a,b)=>a.primera<b.primera?-1:1);
  const pasadas = evs.filter(x=>x.ultima<hoy).sort((a,b)=>a.ultima>b.ultima?-1:1);
  const tarjeta = ({id,e}) => `<button class="ev" data-a="ir-fecha" data-id="${id}"><h4>${TIPOS[e.tipo]}: ${esc(e.titulo)}</h4>
    <ul>${Object.entries(e.fechas).sort((a,b)=>a[1]<b[1]?-1:1).map(([g,k])=>{ const f = diasHasta(k);
      return `<li><span class="grupo" style="--gc:${gc(g)}">${GRUPOS[g].nombre.replace(' ESO','')}</span> ${larga(k)}${f>=0?` <span class="t">· ${cuenta({g,k,falta:f})}</span>`:''}</li>`; }).join('')}</ul>
    ${e.notas?`<div class="t" style="margin-top:4px">${esc(e.notas)}</div>`:''}</button>`;

  h += futuras.length ? futuras.map(tarjeta).join('') : `<div class="vacio">No hay fechas próximas.<br>Apunta pruebas y entregas en cuanto las fijes: la app te dirá cuántas clases te quedan.</div>`;

}

let borrador = null, abiertoId = null;
function abrir(k, n){
  const x = (franjasDe(k))[n];
  if(!x) return;
  abiertoId = idSes(k,n);
  const s = store.ses[abiertoId];
  borrador = s ? clon(s) : {
    fecha:k, franja:n, grupo:x.g||null, otra:x.o||null, aula:x.aula||'',
    estado:'si', motivo:'', contenido:'', material:'', deberes:'', revisiones:[], clima:'', cambio:'', observacion:'', notas:'',
    ...(x.pt ? {pt:'si', ptNotas:''} : {}),
    unidad: x.g ? ultimaUnidad(x.g) : '',
    // una sesión de hace dos días o más se está reconstruyendo después
    reconstruido: diasHasta(k) <= -2, fuente:''
  };
  if(x.pt && borrador.pt===undefined){ borrador.pt='si'; borrador.ptNotas=''; }
  pintarHoja();
  $('#velo').classList.add('abierto'); $('#hoja').classList.add('abierta');
  document.body.style.overflow='hidden';
  setTimeout(()=>{ const t = $('#hoja textarea'); if(t && !s) t.focus(); }, 250);
}

}

// Con el menú de compartir de Android se puede mandar a Drive, al correo…;
// si el navegador no lo permite, se descarga en la carpeta de Descargas.
async function descargar(nombre, datos, tipo){
  const f = new File([datos], nombre, {type:tipo});
  if(navigator.canShare && navigator.canShare({files:[f]})){
    try{ await navigator.share({files:[f], title:nombre}); toast('Enviado'); return true; }
    catch(e){ if(e && e.name==='AbortError'){ toast('Cancelado'); return false; } }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(f); a.download = nombre; document.body.appendChild(a); a.click();

function filasExport(){
  const desde = $('#ex-desde').value, hasta = $('#ex-hasta').value;
  const sel = [...document.querySelectorAll('.ex-g:checked')].map(i=>i.value);
  return Object.entries(store.ses)
    .filter(([id,s])=> s.fecha>=desde && s.fecha<=hasta && (s.grupo ? sel.includes(s.grupo) : sel.includes('otras')))
    .sort((a,b)=>a[0]<b[0]?-1:1).map(([id,s])=>({id,...s}));
}
const textoRev = s => (s.revisiones||[]).map(r=>{
  const o = store.ses[r.de]; return `Deberes del ${o?corta(o.fecha):corta(r.de.split('_')[0])}: ${r.no&&r.no.length?'no los traen nº '+r.no.join(', '):'los traen todos'}`;
}).join('; ');
function csv(){
  const f = filasExport();
  const cab = ['Fecha','Día','Hora','Grupo','Aula','Impartida','Motivo','Unidad','Qué se ha hecho','Material','Deberes puestos','Revisión de deberes','Clima del aula','PT en el aula','Trabajo con la PT','Cambio respecto al grupo anterior','Observación','Notas','Registrado el','Última modificación','Cambios','Reconstruido','A partir de'];
  const q = v => `"${String(v??'').replace(/"/g,'""')}"`;
  const filas = f.map(s=>[s.fecha, DIAS[deClave(s.fecha).getDay()], `${FR[s.franja].ini}-${FR[s.franja].fin}`,
    s.grupo?GRUPOS[s.grupo].nombre:OTRAS[s.otra], s.aula||'', s.grupo?(s.estado==='no'?'No':'Sí'):'', s.motivo||'', s.grupo?nombreUnidad(s.grupo,s.unidad):'',
    s.contenido||'', s.material||'', s.deberes||'', textoRev(s), s.clima?CLIMA[s.clima]:'', s.pt?(s.pt==='no'?'No ha venido':'Sí'):'', s.pt&&s.pt!=='no'?(s.ptNotas||''):'', s.cambio||'', s.observacion||'', s.notas||'', fechaHora(s.creado||s.actualizado), fechaHora(s.actualizado), (s.historial||[]).length, s.reconstruido?'Sí':'', s.reconstruido?(s.fuente||''):''].map(q).join(';'));
  return '\ufeff' + [cab.map(q).join(';'), ...filas].join('\r\n');

function calendarioInforme(desde, hasta, gs){
  const filas = [];
  for(const [id,e] of Object.entries(store.ev||{})) for(const [g,k] of Object.entries(e.fechas||{}))
    if(gs.includes(g) && k>=desde && k<=hasta) filas.push({g,k,e});
  if(!filas.length) return '';
  filas.sort((a,b)=>a.k<b.k?-1:1);
  return `<h2>Calendario de pruebas y entregas</h2><table><thead><tr><th>Fecha</th><th>Grupo</th><th>Tipo</th><th>Qué</th><th>Fijada el</th></tr></thead><tbody>
    ${filas.map(x=>`<tr><td>${corta(x.k)}</td><td>${GRUPOS[x.g].nombre}</td><td>${TIPOS[x.e.tipo]}</td><td>${esc(x.e.titulo)}${x.e.notas?`<div class="mat">${esc(x.e.notas)}</div>`:''}</td><td class="reg">${fechaHora(x.e.creado)}</td></tr>`).join('')}
  </tbody></table>`;
}
function informe(){
  const f = filasExport(), c = store.cfg;
  const desde = $('#ex-desde').value, hasta = $('#ex-hasta').value;
  const sel = [...document.querySelectorAll('.ex-g:checked')].map(i=>i.value);
  const gs = Object.keys(GRUPOS).filter(g=>sel.includes(g));
  // 1. resumen de indicadores
  let resumen = `<h2>Resumen</h2><table><thead><tr><th>Grupo</th><th>Previstas</th><th>Impartidas</th><th>No impartidas</th>
    <th>Sin registrar</th><th>Entrega de deberes</th><th>Clima: bien / a ratos / no</th><th>Con PT</th></tr></thead><tbody>`;
  for(const g of gs){
    const I = indicadores(g, desde, hasta);
    resumen += `<tr><td>${GRUPOS[g].nombre}</td><td>${I.previstas}</td><td>${I.dadas}</td><td>${I.noDadas}</td><td>${I.sinRegistrar}</td>
      <td>${I.entrega===null?'—':I.entrega+' % ('+I.revisadas+' revisiones)'}</td>
      <td>${I.climaN?`${pct(I.clima.bien,I.climaN)} / ${pct(I.clima.regular,I.climaN)} / ${pct(I.clima.mal,I.climaN)} %`:'—'}</td>
      <td>${I.pt?`${I.ptSi} de ${I.pt}`:'—'}</td></tr>`;
  }
  const nRec = f.filter(s=>s.reconstruido).length;
  resumen += `</tbody></table>${nRec?`<p class="meta">${nRec} ${nRec===1?'sesión se registró después, reconstruida':'sesiones se registraron después, reconstruidas'} a partir de lo indicado en cada una.</p>`:''}<p class="meta">«Previstas»: sesiones del horario en días lectivos del periodo que ya han pasado.
    «Entrega de deberes»: porcentaje de alumnado que los trae, sobre las revisiones registradas.</p>`;
  // 2. clima por franja horaria
  const cf = climaPorFranja(desde, hasta);
  const hayClima = Object.values(cf).some(x=>x.bien+x.regular+x.mal);
  if(hayClima){
    resumen += `<h2>Clima del aula por franja horaria</h2><table><thead><tr><th>Franja</th><th>Sesiones</th><th>Se ha podido trabajar</th><th>A ratos</th><th>No se ha podido</th></tr></thead><tbody>`;
    for(const n of [1,2,3,4,5,6]){ const x = cf[n], t = x.bien+x.regular+x.mal; if(!t) continue;
      resumen += `<tr><td>${FR[n].ini}–${FR[n].fin}</td><td>${t}</td><td>${pct(x.bien,t)} %</td><td>${pct(x.regular,t)} %</td><td>${pct(x.mal,t)} %</td></tr>`; }
    resumen += `</tbody></table>`;
  }
  // 3. por grupo: programación y sesiones
  let cuerpo = '';
  for(const g of [...gs, 'otras']){
    if(g==='otras' && !sel.includes('otras')) continue;
    const filas = f.filter(s => g==='otras' ? !s.grupo : s.grupo===g);
    if(!filas.length) continue;
    const titulo = g==='otras' ? 'Guardias y otras tareas' : GRUPOS[g].nombre;
    cuerpo += `<h2>${titulo}</h2>`;
    if(g!=='otras'){
      const I = indicadores(g, desde, hasta);
      if(I.porUnidad.length){
        cuerpo += `<table class="prog"><thead><tr><th>Unidad o situación de aprendizaje</th><th>Sesiones</th><th>Previstas</th><th>Cumplimiento</th></tr></thead><tbody>`;
        I.porUnidad.forEach(u=>{ cuerpo += `<tr><td>${esc(u.nombre)}</td><td>${u.dadas}</td><td>${u.previstas||'—'}</td><td>${u.previstas?Math.min(100,pct(u.dadas,u.previstas))+' %':'—'}</td></tr>`; });
        if(I.sinUnidad) cuerpo += `<tr><td><i>Sin unidad asignada</i></td><td>${I.sinUnidad}</td><td></td><td></td></tr>`;
        cuerpo += `</tbody></table>`;
      }
    }
    cuerpo += `<table><thead><tr><th>Fecha</th><th>Hora</th>${g==='otras'?'<th>Tarea</th><th>Notas</th>':'<th>Unidad</th><th>Qué se ha hecho</th><th>Deberes</th><th>Revisión</th><th>Clima</th>'}<th>Registro</th></tr></thead><tbody>`;
    for(const s of filas){
      const reg = `${fechaHora(s.creado||s.actualizado)}${(s.historial||[]).length?`<br>${s.historial.length} cambio${s.historial.length>1?'s':''}`:''}${s.reconstruido?`<br><i>reconstruido${s.fuente?' a partir de: '+esc(s.fuente):''}</i>`:''}`;
      if(g==='otras'){
        cuerpo += `<tr><td>${corta(s.fecha)}</td><td>${FR[s.franja].ini}</td><td>${OTRAS[s.otra]}</td><td>${esc(s.notas)}</td><td class="reg">${reg}</td></tr>`;
      }else if(s.estado==='no'){
        cuerpo += `<tr class="no"><td>${corta(s.fecha)}</td><td>${FR[s.franja].ini}</td><td colspan="5">No impartida: ${esc(s.motivo)}${s.notas?' — '+esc(s.notas):''}</td><td class="reg">${reg}</td></tr>`;
      }else{
        cuerpo += `<tr><td>${corta(s.fecha)}</td><td>${FR[s.franja].ini}</td><td>${esc(nombreUnidad(g,s.unidad))}</td>
          <td>${esc(s.contenido)}${s.material?`<div class="mat">${esc(s.material)}</div>`:''}${s.pt?`<div class="mat">PT: ${s.pt==='no'?'no ha venido':'en el aula'+(s.ptNotas?' — '+esc(s.ptNotas):'')}</div>`:''}${s.observacion?`<div class="mat">Observación: ${esc(s.observacion)}</div>`:''}</td>
          <td>${esc(s.deberes)}</td><td>${esc(textoRev(s))}</td><td>${s.clima?CLIMA[s.clima]:''}</td><td class="reg">${reg}</td></tr>`;
      }
    }
    cuerpo += `</tbody></table>`;
  }
  if(!cuerpo) cuerpo = '<p>No hay sesiones registradas en esas fechas.</p>';
  // 4. registros borrados en el periodo
  const bor = (c.borrados||[]).filter(x=>x.fecha>=desde && x.fecha<=hasta);
  let borr = '';
  if(bor.length){
    borr = `<h2>Registros borrados</h2><table><thead><tr><th>Sesión</th><th>Grupo o tarea</th><th>Borrado el</th><th>Contenido</th></tr></thead><tbody>`;
    bor.forEach(x=>{ borr += `<tr><td>${corta(x.fecha)} ${FR[x.franja]?FR[x.franja].ini:''}</td><td>${GRUPOS[x.grupo]?GRUPOS[x.grupo].nombre:(OTRAS[x.grupo]||'')}</td><td>${fechaHora(x.t)}</td><td>${esc(x.resumen)}</td></tr>`; });
    borr += `</tbody></table>`;
  }
  return `<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Registro de aula</title>
<style>body{font-family:Arial,Helvetica,sans-serif;font-size:10pt;color:#111;margin:18mm}
h1{font-size:16pt;margin:0 0 2mm}h2{font-size:12pt;margin:7mm 0 2mm;border-bottom:1.5px solid #1D3A8A;color:#1D3A8A}
.cab{color:#444;margin-bottom:3mm}.meta{color:#555;margin:1mm 0 0;font-size:8.5pt}
table{width:100%;border-collapse:collapse;margin-bottom:3mm}tr{page-break-inside:avoid}
th,td{border:1px solid #bbb;padding:3px 5px;text-align:left;vertical-align:top}th{background:#eef2f8;font-size:9pt}
td:nth-child(1),td:nth-child(2){white-space:nowrap}.mat{color:#555;font-size:8.5pt;margin-top:2px}
td.reg{font-size:8pt;color:#666;white-space:nowrap}table.prog{width:auto;min-width:60%}
tr.no td{color:#777;font-style:italic}.pie{margin-top:8mm;color:#666;font-size:8.5pt}
@page{size:A4;margin:12mm}@media print{body{margin:0}}</style></head><body>
<h1>Registro de aula</h1>
<div class="cab">${[c.docente, c.centro, c.curso?'Curso '+c.curso:''].filter(Boolean).map(esc).join(' · ')}<br>
Del ${larga(desde)} al ${larga(hasta)}</div>${resumen}${calendarioInforme(desde, hasta, gs)}${cuerpo}${borr}
<p class="pie">Generado el ${larga(hoyK())} a las ${fechaHora(new Date().toISOString()).split(' ')[1]} con el cuaderno de aula (versión ${VERSION_APP}).
Cada sesión indica cuándo se registró y cuántas veces se ha modificado; los registros borrados quedan listados.</p></body></html>`;
}

    if(!Object.keys(evBorr.fechas).length){ toast('Elige al menos un grupo'); return; }
    const ahora = new Date().toISOString(), prev = store.ev[evId];
    evBorr.creado = prev ? (prev.creado||ahora) : ahora; evBorr.actualizado = ahora;
    store.ev[evId] = clon(evBorr); guardarLocal(); evBorr = null; cerrar(); toast('Fecha guardada'); pintar(); return;
  }
  else if(a==='borrar'){
    if(confirm('¿Borrar esta fecha?')){ delete store.ev[evId]; guardarLocal(); evBorr=null; cerrar(); toast('Fecha borrada'); pintar(); }
    return;
  }
  pintarHojaFecha();
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && $('#hoja').classList.contains('abierta')) cerrar(); });
// al volver a la app (cambio de pestaña o de hora) se repinta: la franja «ahora» se mueve sola
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && !borrador) pintar(); });
setInterval(()=>{ if(!borrador && vista==='dia') pintar(); }, 60000);

/* ═══════════════════════════ ARRANQUE ═══════════════════════════ */
leerLocal();
if(!esLectivo(dia) && [0,6].includes(deClave(dia).getDay())){
  let d = deClave(dia); while(d.getDay()===0||d.getDay()===6) d = masDias(d,1); dia = clave(d);
}
pintar();
conectar();
</script>
