<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuaderno de aula</title>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="theme-color" content="#1D3A8A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ── Cuaderno de aula ─────────────────────────────────────────────────────
   Un cuaderno de profesor de matemáticas: papel cuadriculado, tinta de
   bolígrafo azul, el rojo de corregir, y cada grupo subrayado con el color
   que tiene en el horario del centro. */
:root{
  --papel:#FBFCFD; --cuad:#DDE7F1; --tinta:#1D3A8A; --grafito:#262A31;
  --gris:#687180; --linea:#C8D5E2; --rojo:#C8322B; --hoja:#FFFFFF;
  --sombra:0 1px 0 rgba(29,58,138,.08), 0 6px 18px -10px rgba(29,58,138,.35);
  --g1A:#D2CE5C; --g1B:#6BB3EE; --g1D:#F59C63; --g2B:#44C35A; --gR4:#3BBDB7; --gX:#C9CED6;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --papel:#11151B; --cuad:#1A212B; --tinta:#93B2FF; --grafito:#E7EAEF;
    --gris:#9AA4B2; --linea:#2B3542; --rojo:#FF7064; --hoja:#171C24;
    --sombra:0 1px 0 rgba(0,0,0,.4), 0 8px 20px -12px rgba(0,0,0,.8);
    --g1A:#A9A640; --g1B:#3F86C2; --g1D:#C9763F; --g2B:#2E9A42; --gR4:#23928D; --gX:#4A5360;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --papel:#11151B; --cuad:#1A212B; --tinta:#93B2FF; --grafito:#E7EAEF;
  --gris:#9AA4B2; --linea:#2B3542; --rojo:#FF7064; --hoja:#171C24;
  --sombra:0 1px 0 rgba(0,0,0,.4), 0 8px 20px -12px rgba(0,0,0,.8);
  --g1A:#A9A640; --g1B:#3F86C2; --g1D:#C9763F; --g2B:#2E9A42; --gR4:#23928D; --gX:#4A5360;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.45;color:var(--grafito);
  background-color:var(--papel);
  background-image:linear-gradient(var(--cuad) 1px,transparent 1px),linear-gradient(90deg,var(--cuad) 1px,transparent 1px);
  background-size:22px 22px;
  min-height:100vh;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--tinta);outline-offset:2px;border-radius:6px}
.app{max-width:680px;margin:0 auto;padding:14px 16px 110px}

/* cabecera: la fecha es lo grande, escrita en tinta */
.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 4px}
.fecha{color:var(--tinta);line-height:1.05}
.fecha .dia{font-size:15px;font-weight:700;display:block;margin-bottom:2px}
.fecha .num{font-size:44px;font-weight:700;letter-spacing:-.5px}
.fecha .mes{font-size:22px;font-weight:400;margin-left:6px}
.nav{display:flex;gap:6px}
.btn-r{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--linea);background:var(--hoja);
  display:grid;place-items:center;color:var(--tinta);font-size:22px;line-height:1}
.hoy{height:44px;padding:0 14px;border-radius:22px;border:1.5px solid var(--tinta);background:var(--hoja);color:var(--tinta);font-weight:700}
.estado-sync{font-size:13px;color:var(--gris);margin:0 0 12px}
.estado-sync b{color:var(--grafito);font-weight:700}

.aviso{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--hoja);border:1.5px solid var(--rojo);color:var(--rojo);
  border-radius:12px;padding:10px 12px;margin:8px 0 14px;font-weight:700;width:100%;text-align:left}
.aviso small{font-weight:400;color:var(--gris);display:block}
.aviso.copia{background:var(--tinta);border-color:var(--tinta);color:var(--hoja)}
.aviso.copia small{color:var(--hoja);opacity:.85}
.barras{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--linea);margin:6px 0 2px}
.barras span{display:block;height:100%}
.leyenda{font-size:13px;color:var(--gris)}
.unidad{margin-bottom:10px}
.unidad .n{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.prog{height:8px;border-radius:4px;background:var(--linea);overflow:hidden;margin-top:4px}
.prog span{display:block;height:100%;background:var(--tinta)}
/* programación: barra con la raya de dónde dice el plan que deberías ir */
.pbar{position:relative;height:12px;border-radius:6px;background:var(--linea);margin:4px 0 6px}
.pbar>span{display:block;height:100%;border-radius:6px;background:var(--tinta)}
.pbar>i{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1px;background:var(--rojo);border-radius:2px}
.tarde{color:var(--rojo)}
.perd{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.perd>span{width:50px;font-size:14px;color:var(--gris)}
.perd{gap:5px}.perd .chip{min-width:42px;padding:6px 8px;text-align:center}
.perd .chip[aria-pressed="true"]{border-color:var(--rojo);color:var(--rojo);font-weight:700}
details.sa{margin-bottom:8px;padding:6px 12px}
details.sa summary{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline;list-style:none}
details.sa summary::-webkit-details-marker{display:none}
details.sa summary .prog{grid-column:1/-1;margin-top:2px}
.sa-n{font-weight:700}.sa-c{font-size:13px;color:var(--gris);font-weight:400;font-variant-numeric:tabular-nums}
details.sa.hecha .sa-n{color:var(--gris)}
.pasos{list-style:none;padding:0;margin:4px 0 0}
.paso-b{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:9px 0;border-top:1px dashed var(--linea);font-size:15px}
.paso-b .caja{flex:none;width:24px;height:24px;margin-top:1px;border:2px solid var(--tinta);border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--hoja)}
.paso-b[aria-pressed="true"] .caja{background:var(--tinta)}
.paso-b[aria-pressed="true"] .txt{color:var(--gris)}
.paso-b .txt{flex:1}.paso-b small{display:block;font-size:13px;color:var(--gris);margin-top:2px}
.paso-b .etq{flex:none}
.horq{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px 34px;font-size:14px}
.horq small{flex-basis:100%;font-size:13px;color:var(--gris)}
.horq .chip{padding:4px 10px;font-size:14px}.horq .chip.sel{border-color:var(--tinta);color:var(--tinta);font-weight:700}
details.semana{margin-top:16px}
details.semana ul{list-style:none;padding:0;margin:6px 0 0}
details.semana li button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;border-top:1px dashed var(--linea);background:none;padding:9px 0;font-size:15px}
details.semana .grupo{flex:none}.sem-t small{display:block;font-size:13px;color:var(--gris);margin-top:2px}
.prox{list-style:none;margin:0 0 14px;padding:0}
.prox button{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;
  background:var(--hoja);border:1px solid var(--linea);border-radius:12px;padding:9px 12px;margin-bottom:6px}
.prox .cuando{font-weight:700;color:var(--tinta);font-size:15px;min-width:64px}
.prox .cuando.cerca{color:var(--rojo)}
.prox .que{font-size:15px}
.prox .que small{display:block;color:var(--gris);font-size:13px}
.etq{display:inline-block;font-size:12px;font-weight:700;color:var(--rojo);border:1.5px solid var(--rojo);
  border-radius:10px;padding:0 6px;margin-left:6px;line-height:18px;vertical-align:1px}
.ev{background:var(--hoja);border:1px solid var(--linea);border-radius:12px;padding:10px 12px;margin-bottom:8px;width:100%;text-align:left}
.ev h4{margin:0 0 4px;font-size:16px}
.ev .t{font-size:13px;color:var(--gris)}
.ev ul{list-style:none;margin:6px 0 0;padding:0}
.ev li{font-size:14px;margin:3px 0}
.g-fecha{display:grid;grid-template-columns:120px 1fr;gap:8px;align-items:center;margin-top:8px}
.recons{border:1px dashed var(--gris);border-radius:12px;padding:10px 12px;background:var(--hoja)}
.registro{font-size:13px;color:var(--gris);margin:18px 0 0;border-top:1px dashed var(--linea);padding-top:10px}
.u-fila{display:grid;grid-template-columns:1fr 70px 40px;gap:6px;margin-bottom:6px;align-items:center}
.u-fila button{height:40px;border:0;background:none;color:var(--rojo);font-size:20px}

/* las franjas: renglones del día */
.franjas{list-style:none;margin:0;padding:0}
.fr{display:grid;grid-template-columns:62px 1fr auto;align-items:center;gap:10px;
  background:var(--hoja);border:1px solid var(--linea);border-radius:12px;padding:10px 12px;margin-bottom:8px;
  width:100%;text-align:left;box-shadow:var(--sombra)}
.fr.otra{box-shadow:none;background:transparent;border-style:dashed}
.fr.ahora{border:2px solid var(--tinta)}
.hora{font-variant-numeric:tabular-nums;font-size:14px;color:var(--gris);line-height:1.2}
.hora b{display:block;color:var(--grafito);font-size:16px}
.grupo{font-weight:700;font-size:18px;display:inline;padding:0 3px;
  background:linear-gradient(transparent 52%,var(--gc,var(--gX)) 52%,var(--gc,var(--gX)) 92%,transparent 92%)}
.sub{font-size:14px;color:var(--gris);margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.marca{font-size:13px;font-weight:700;white-space:nowrap}
.marca.ok{color:var(--tinta)}
.marca.pend{color:var(--rojo)}
.marca.no{color:var(--gris);text-decoration:line-through}
.marca.borr{color:var(--tinta);font-style:italic}
.recuperado{border:1.5px dashed var(--tinta);border-radius:12px;padding:10px 12px;margin:10px 0 4px;font-size:15px}
.recuperado small{color:var(--gris);display:block;margin-top:2px}
.recuperado button{margin-top:8px}
.recreo{font-size:13px;color:var(--gris);text-align:center;margin:2px 0 10px;letter-spacing:.3px}
.pt{display:inline-block;font-size:12px;font-weight:700;color:var(--tinta);border:1.5px solid var(--tinta);
  border-radius:10px;padding:0 6px;margin-left:6px;line-height:18px;vertical-align:1px}
.vacio{background:var(--hoja);border:1px solid var(--linea);border-radius:12px;padding:18px;text-align:center;color:var(--gris)}
.vacio b{color:var(--grafito)}

/* barra inferior */
.barra{position:fixed;left:0;right:0;bottom:0;background:var(--hoja);border-top:1px solid var(--linea);
  padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.barra nav{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.barra button{background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:13px;color:var(--gris)}
.barra button[aria-current="page"]{color:var(--tinta);font-weight:700}
.barra svg{width:24px;height:24px}

/* la hoja de la sesión */
.velo{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:10;display:none}
.velo.abierto{display:block}
.hoja{position:fixed;left:0;right:0;bottom:0;top:0;z-index:11;background:var(--papel);
  overflow:auto;transform:translateY(100%);transition:transform .22s ease-out;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.hoja.abierta{transform:none}
@media (prefers-reduced-motion: reduce){.hoja{transition:none}}
.hoja-in{max-width:680px;margin:0 auto;padding:12px 16px 120px}
.hoja-cab{position:sticky;top:0;background:var(--papel);padding:10px 0 10px;z-index:2;
  display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--linea)}
.hoja-cab h2{margin:0;font-size:20px;color:var(--tinta)}
.hoja-cab .quando{font-size:14px;color:var(--gris)}
.cerrar{height:44px;padding:0 14px;border-radius:22px;border:1.5px solid var(--linea);background:var(--hoja)}
.campo{margin:16px 0}
.campo > label,.campo > .et{display:block;font-weight:700;margin-bottom:6px}
.campo .ayuda{font-size:14px;color:var(--gris);font-weight:400}
textarea,input[type=text],input[type=date],input[type=number]{
  width:100%;border:1.5px solid var(--linea);background:var(--hoja);border-radius:10px;padding:10px 12px;font-size:17px}
textarea{min-height:84px;resize:vertical}
textarea:focus,input:focus{border-color:var(--tinta);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1.5px solid var(--linea);background:var(--hoja);border-radius:18px;padding:6px 12px;font-size:15px}
.chip.igual{border-color:var(--tinta);color:var(--tinta)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1.5px solid var(--linea);background:var(--hoja);border-radius:10px;padding:10px 6px;font-size:15px;line-height:1.2}
.seg button[aria-pressed="true"]{border-color:var(--tinta);background:var(--tinta);color:var(--hoja);font-weight:700}
.seg.dos{grid-template-columns:repeat(2,1fr)}
.deber{border:1px solid var(--linea);background:var(--hoja);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.deber-cab{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.deber-cab p{margin:0}
.deber-cab .de{font-size:13px;color:var(--gris)}
.tog{border:1.5px solid var(--linea);background:var(--hoja);border-radius:18px;padding:6px 12px;font-size:14px;white-space:nowrap}
.tog[aria-pressed="true"]{border-color:var(--tinta);color:var(--tinta);font-weight:700}
.lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin-top:10px}
.lista button{height:42px;border:1.5px solid var(--linea);background:var(--hoja);border-radius:8px;font-variant-numeric:tabular-nums;font-size:16px}
.lista button[aria-pressed="true"]{border-color:var(--rojo);background:var(--rojo);color:#fff;font-weight:700}
.lista.connom{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.lista.connom button{display:flex;align-items:center;gap:8px;padding:0 10px;text-align:left;font-size:14px}
.lista.connom button b{min-width:22px;font-size:16px}
.lista.connom button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plano .mesa small{display:block;font-size:10px;font-weight:400;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.plano.connom .mesa{height:48px}
.nombres{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--gris);margin-top:8px}
.revl{margin-top:10px;border:1px solid var(--linea);border-radius:10px;background:var(--papel)}
.revl>summary{list-style:none;cursor:pointer;padding:10px 12px;font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.revl>summary::-webkit-details-marker{display:none}
.revl>summary::after{content:'▾';color:var(--gris)} .revl[open]>summary::after{content:'▴'}
.revl .cuenta b{font-variant-numeric:tabular-nums}
.revl .filas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 10px;padding:0 8px 8px}
.revl .fila{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;height:40px;padding:0 10px;border:1.5px solid var(--linea);border-radius:8px;background:var(--hoja);text-align:left;font-size:15px}
.revl .fila .n{min-width:24px;font-weight:700;font-variant-numeric:tabular-nums}
.revl .fila .nom{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.revl .fila .est{font-size:13px;white-space:nowrap;padding:3px 9px;border-radius:12px;border:1px solid var(--linea);color:var(--grafito)}
.revl .fila[aria-pressed="true"]{border-color:var(--rojo)}
.revl .fila[aria-pressed="true"] .est{background:var(--rojo);border-color:var(--rojo);color:#fff;font-weight:700}
.revl .fila{cursor:default}
.revl .fila .bt{display:flex;gap:4px;margin-left:auto}
.revl .fila .bt button{height:30px;min-width:34px;padding:0 8px;border:1.5px solid var(--linea);border-radius:15px;background:var(--hoja);font-size:13px;color:var(--grafito)}
.revl .fila .ok{font-size:13px;color:var(--gris);white-space:nowrap}
.revl .fila.st-no{border-color:var(--rojo)} .revl .fila.st-medias{border-color:#b7791f} .revl .fila.st-falta{border-style:dashed;opacity:.75}
.revl .fila .bt button[data-v="no"][aria-pressed="true"]{background:var(--rojo);border-color:var(--rojo);color:#fff;font-weight:700}
.revl .fila .bt button[data-v="medias"][aria-pressed="true"]{background:#b7791f;border-color:#b7791f;color:#fff;font-weight:700}
.revl .fila .bt button[data-v="falta"][aria-pressed="true"]{background:var(--gris);border-color:var(--gris);color:#fff;font-weight:700}
.plano .mesa.st-medias,.sin-mesa button.st-medias{background:#b7791f!important;border-color:#b7791f!important;color:#fff}
.plano .mesa.st-falta,.sin-mesa button.st-falta{background:var(--gris)!important;border-color:var(--gris)!important;color:#fff;border-style:dashed!important}
.pincel{margin-top:10px}
.porAl{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.porAl th,.porAl td{border-bottom:1px solid var(--linea);padding:5px 4px;text-align:center;font-variant-numeric:tabular-nums}
.porAl th:nth-child(2),.porAl td:nth-child(2){text-align:left}
.revl .filtro{display:flex;gap:6px;padding:0 8px 8px}
.lista-nota{font-size:13px;color:var(--gris);margin-top:6px}
/* plano del aula */
.pizarra{text-align:center;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--gris);border-bottom:3px solid var(--grafito);margin:10px 18% 8px;padding-bottom:2px}
.plano{display:grid;gap:5px;margin-bottom:8px}
.plano .mesa{height:40px;border:1.5px dashed var(--linea);background:transparent;border-radius:8px;font-variant-numeric:tabular-nums;font-size:16px;padding:0}
.plano .mesa.llena{border-style:solid;background:var(--hoja);font-weight:700;color:var(--tinta)}
.plano .mesa[aria-pressed="true"]{border-color:var(--rojo);background:var(--rojo);color:#fff}
.plano .mesa:disabled{visibility:hidden}
.plano-ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0}
.plano-ctl .btn-r{width:36px;height:36px;font-size:18px}
.plano-ctl b{min-width:20px;text-align:center}
.plano-sig{margin:4px 0 0;font-size:15px}
.sin-mesa{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;align-items:center;font-size:13px;color:var(--gris)}
.sin-mesa button{width:40px;height:36px;border:1.5px solid var(--linea);background:var(--hoja);border-radius:8px}
.sin-mesa button[aria-pressed="true"]{border-color:var(--rojo);background:var(--rojo);color:#fff;font-weight:700}

details{border:1px dashed var(--linea);border-radius:12px;padding:8px 12px;background:var(--hoja)}
summary{font-weight:700;cursor:pointer;padding:4px 0}
.acciones{position:fixed;left:0;right:0;bottom:0;background:var(--hoja);border-top:1px solid var(--linea);z-index:12;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.acciones div{max-width:680px;margin:0 auto;display:flex;gap:10px}
.primario{flex:1;height:50px;border-radius:12px;border:0;background:var(--tinta);color:var(--hoja);font-weight:700;font-size:18px}
.secundario{height:50px;border-radius:12px;border:1.5px solid var(--linea);background:var(--hoja);padding:0 16px}
.peligro{color:var(--rojo);border-color:var(--rojo)}

/* grupos */
h1.titulo{font-size:28px;color:var(--tinta);margin:8px 0 12px;line-height:1.1}
.sel-grupo{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.sel-grupo button{border:1.5px solid var(--linea);background:var(--hoja);border-radius:20px;padding:8px 14px;font-weight:700}
.sel-grupo button[aria-pressed="true"]{border-color:var(--grafito);box-shadow:inset 0 -6px 0 var(--gc)}
.cifras{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.cifra{background:var(--hoja);border:1px solid var(--linea);border-radius:12px;padding:10px}
.cifra b{display:block;font-size:26px;color:var(--tinta);font-variant-numeric:tabular-nums;line-height:1.1}
.cifra span{font-size:13px;color:var(--gris)}
h3{font-size:17px;margin:18px 0 8px}
.hist{list-style:none;margin:0;padding:0}
.hist button{width:100%;text-align:left;background:var(--hoja);border:1px solid var(--linea);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.hist .f{font-size:13px;color:var(--gris);font-variant-numeric:tabular-nums}
.hist .c{margin:2px 0 0}
.hist .d{font-size:14px;color:var(--tinta);margin-top:4px}
.hist .r{font-size:14px;color:var(--rojo);margin-top:2px}

/* exportar y ajustes */
.panel{background:var(--hoja);border:1px solid var(--linea);border-radius:12px;padding:14px;margin-bottom:14px}
.panel p{margin:0 0 10px}
/* desplegables de Ajustes y de Grupos: cerrados por defecto, con un resumen a la derecha (como «Pasadas» en Fechas) */
details.aj{padding:0}
details.aj>summary,details.pleg>summary{list-style:none;display:flex;align-items:baseline;gap:10px;cursor:pointer}
details.aj>summary{padding:14px}
details.aj>summary::-webkit-details-marker,details.pleg>summary::-webkit-details-marker{display:none}
details.aj>summary>b,details.pleg>summary>b{flex:1 1 auto;min-width:0}
details.aj>summary .res,details.pleg>summary .res{flex:0 0 auto;font-weight:400;font-size:13px;color:var(--gris);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48%}
details.aj>summary::after,details.pleg>summary::after{content:'▾';color:var(--gris);font-weight:400}
details.aj[open]>summary::after,details.pleg[open]>summary::after{content:'▴'}
details.aj>.aj-c{padding:0 14px 14px}
details.pleg{margin-top:18px;border-top:1px solid var(--linea);padding-top:8px}
details.pleg>summary{font-size:17px;padding:4px 0}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.checks label{display:flex;align-items:center;gap:6px;border:1.5px solid var(--linea);border-radius:18px;padding:6px 12px}
.bloque-btn{display:block;width:100%;margin-top:10px;height:50px;border-radius:12px;border:1.5px solid var(--tinta);
  background:var(--hoja);color:var(--tinta);font-weight:700;font-size:16px}
.bloque-btn.lleno{background:var(--tinta);color:var(--hoja)}
.alumnos{display:grid;grid-template-columns:1fr 90px;gap:8px;align-items:center}
.nolect{list-style:none;padding:0;margin:8px 0 0}
.nolect li{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--linea)}
.nolect button{border:0;background:none;color:var(--rojo);font-weight:700}
.nota{font-size:14px;color:var(--gris)}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--grafito);color:var(--papel);padding:10px 16px;border-radius:22px;font-size:15px;z-index:20;
  opacity:0;pointer-events:none;transition:opacity .2s}
.toast.si{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="app" id="app"></div>

<div class="velo" id="velo"></div>
<section class="hoja" id="hoja" aria-modal="true" role="dialog" aria-labelledby="hoja-titulo"></section>

<div class="barra"><nav id="barra" aria-label="Secciones">
  <button data-v="dia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>Día</button>
  <button data-v="grupos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Grupos</button>
  <button data-v="exportar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/></svg>Exportar</button>
  <button data-v="fechas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M8 3v4M16 3v4M12 11v4M12 17.6v.2"/></svg>Fechas</button>
  <button data-v="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M4.2 7.5l2 1.2M17.8 15.3l2 1.2M4.2 16.5l2-1.2M17.8 8.7l2-1.2"/></svg>Ajustes</button>
</nav></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<!-- El selector de la copia vive fuera de #app: al elegir un archivo, Android deja la
     app en segundo plano y, al volver, la vista se repinta; si el selector estuviera
     dentro, se sustituiría y el archivo elegido se perdería. -->
<input type="file" id="archivo-copia" accept=".txt,.json,text/plain,application/json" class="sr" tabindex="-1" aria-hidden="true">
<input type="file" id="archivo-nombres" accept=".csv,.txt,text/csv,text/plain" class="sr" tabindex="-1" aria-hidden="true">
<input type="file" id="archivo-prog" accept=".txt,.json,text/plain,application/json" class="sr" tabindex="-1" aria-hidden="true">

<script>
/* ═══════════════════════════ DATOS FIJOS ═══════════════════════════ */
const FRANJAS = [
  {n:1, ini:'8:15',  fin:'9:10'},
  {n:2, ini:'9:10',  fin:'10:05'},
  {n:3, ini:'10:05', fin:'11:00'},
  {recreo:true},
  {n:4, ini:'11:25', fin:'12:20'},
  {n:5, ini:'12:20', fin:'13:15'},
  {n:6, ini:'13:15', fin:'14:10'},
];
const FR = Object.fromEntries(FRANJAS.filter(f=>f.n).map(f=>[f.n,f]));
const GRUPOS = {
  '1A':{nombre:'1.º ESO A', nivel:1},
  '1B':{nombre:'1.º ESO B', nivel:1},
  '1D':{nombre:'1.º ESO D', nivel:1},
  '2B':{nombre:'2.º ESO B', nivel:2},
  'R4':{nombre:'Refuerzo 4.º ESO', nivel:4},
};
/* ── NOMBRES (solo en memoria) ──
   El listado nombre ↔ número vive en el OneDrive de la GVA, no aquí. Se abre con el selector de
   archivos, se lee y se queda en esta variable mientras la app está abierta: no va a localStorage,
   ni al borrador, ni a las copias de seguridad, ni a los informes. Se olvida al cerrar la app, con
   «Olvidar» o tras 20 minutos en segundo plano. El registro sigue guardando solo números. */
let NOMBRES = null, NOMBRES_DE = '', tOculto = 0;
/* ── REVISIÓN DE DEBERES: cuatro estados ──
   Cada revisión guarda tres listas de números: no (no los trae), medias (a medias) y falta
   (no ha venido). Quien no está en ninguna los trae. Las revisiones antiguas solo tienen «no»
   y siguen valiendo igual. Los ausentes no cuentan en el porcentaje de entrega. */
const EST = {no:'✗ No los trae', medias:'½ A medias', falta:'Falta'};
const DEF_MEDIAS = 'Empezados, pero falta al menos un ejercicio.';
const estadoDe = (r,n) => (r.no||[]).includes(n) ? 'no' : (r.medias||[]).includes(n) ? 'medias' : (r.falta||[]).includes(n) ? 'falta' : 'si';
function ponEstado(r, n, st){
  const prev = estadoDe(r, n);
  for(const k of ['no','medias','falta']) r[k] = (r[k]||[]).filter(x=>x!==n);
  if(st!=='si' && st!==prev) r[st] = [...r[st], n].sort((x,y)=>x-y);
}
function cuentaRev(r, N){
  const no = (r.no||[]).length, medias = (r.medias||[]).length, falta = (r.falta||[]).length;
  return {no, medias, falta, si: N - no - medias - falta, presentes: N - falta};
}
function revTxt(r, nom){
  const f = a => a.map(n=> nom && nomDe(nom,n) ? `${n} (${esc(nomCorto(nomDe(nom,n)))})` : n).join(', ');
  const p = [];
  if((r.no||[]).length) p.push('no los traen '+f(r.no));
  if((r.medias||[]).length) p.push('a medias '+f(r.medias));
  if((r.falta||[]).length) p.push('faltan '+f(r.falta));
  return p.length ? p.join(' · ') : 'los traen todos';
}
// estado de pantalla de la lista de deberes (no se guarda): plegadas, filtro y revisiones quitadas por error
const revPlegadas = new Set(), revFiltro = {}, revQuitadas = {}, revPincel = {};
let paDesde = '', paHasta = '';
/* Deberes por alumno (número de lista) en un periodo: base para el instrumento «trabajo diario»
   si la programación lo recoge. Cuenta solo revisiones en las que el alumno estaba. */
function deberesPorAlumno(g, desde, hasta){
  const N = store.cfg.alumnos[g] || 25, A = {};
  for(let i=1;i<=N;i++) A[i] = {si:0, medias:0, no:0, falta:0};
  let nRev = 0;
  sesionesDe(g).forEach(([,s])=>{ if(s.estado==='no' || s.fecha<desde || s.fecha>hasta) return;
    (s.revisiones||[]).forEach(r=>{ nRev++; for(let i=1;i<=N;i++) A[i][estadoDe(r,i)]++; }); });
  return {N, nRev, A};
}
const normG = s => String(s||'').toUpperCase().replace(/ESO|[º°ª.\s-]/g,'');
function grupoDeTexto(s){
  const n = normG(s); if(!n) return null;
  for(const k in GRUPOS){ if(normG(k)===n || normG(GRUPOS[k].nombre)===n) return k; }
  if(/REF|TALLER|R4/.test(n)) return Object.keys(GRUPOS).find(k=>GRUPOS[k].nivel===4) || null;
  return null;
}
function leerNombres(txt){
  const lin = String(txt).replace(/^\uFEFF/,'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lin.length) return null;
  const sep = [';','\t',','].find(c=>lin[0].includes(c)) || ';';
  const out = {}; let n = 0, malas = 0;
  for(const l of lin){
    const c = l.split(sep).map(x=>x.trim().replace(/^"(.*)"$/,'$1').trim());
    const g = grupoDeTexto(c[0]), num = parseInt(c[1]);
    const nom = c.slice(2).filter(Boolean).join(', ');
    if(!g || !(num>0) || !nom){ malas++; continue; }   // cabecera o fila rara
    (out[g] = out[g] || {})[num] = nom; n++;
  }
  return n ? {out, n, malas} : null;
}
// «García López, Lucía» o «Lucía García López» → «Lucía G.»
function nomCorto(s){
  if(!s) return '';
  let nom, ape;
  if(s.includes(',')){ const [a, b] = s.split(','); nom = b.trim(); ape = a.trim(); }
  else{ const w = s.trim().split(/\s+/); nom = w[0]; ape = w.slice(1).join(' '); }
  const pila = nom.split(/\s+/).slice(0,2).join(' ');
  return ape ? `${pila} ${ape[0].toUpperCase()}.` : pila;
}
const nomDe = (g, n) => NOMBRES && NOMBRES[g] && NOMBRES[g][n] || '';
function olvidarNombres(aviso){ NOMBRES = null; NOMBRES_DE = ''; if(aviso) toast(aviso); }
const OTRAS = {G:'Guardia', C:'Complementarias', RM:'Reunión de departamento', AF:'Atención a familias'};
// HORARIO[día de la semana 1..5][franja] — del horario del centro.
// pt: sesión con la PT en el aula (POR6 en el horario; solo en 1.º A y 1.º B).
const HORARIO = {
  1:{1:{g:'1B',aula:'A114'}, 2:{g:'1A',aula:'A114',pt:true}, 3:{o:'C'}},
  2:{3:{g:'1D',aula:'A100'}, 4:{g:'1A',aula:'A114'}, 5:{g:'1B',aula:'A114',pt:true}, 6:{g:'2B',aula:'A114'}},
  3:{1:{o:'G'}, 2:{g:'1D',aula:'A104'}, 3:{o:'RM'}, 4:{g:'2B',aula:'A100'}, 5:{o:'AF'}, 6:{g:'R4',aula:'A200'}},
  4:{1:{g:'2B',aula:'A100'}, 2:{g:'1B',aula:'A100',pt:true}, 3:{o:'G'}, 4:{g:'1A',aula:'A100',pt:true}, 5:{g:'1D',aula:'A100'}, 6:{o:'C'}},
  5:{1:{g:'2B',aula:'A100'}, 2:{o:'G'}, 3:{g:'1D',aula:'A100'}, 4:{g:'R4',aula:'A114'}, 5:{g:'1A',aula:'A114'}, 6:{g:'1B',aula:'A114'}},
};
const CLIMA = {bien:'Se ha podido trabajar', regular:'A ratos', mal:'No se ha podido'};
// Minutos de clase perdidos: hasta que se puede empezar a trabajar, y antes del timbre (recoger, salir).
const PERD_INI = [0,5,10,15,20,30], PERD_FIN = [0,5,10,15];
const DUR = 55;   // minutos de una sesión
const MOTIVOS = ['Festivo','Excursión o actividad','Ausencia del docente','Examen de otra materia','Otro'];
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

/* ═══════════════════════════ FECHAS ═══════════════════════════ */
const pad = n => String(n).padStart(2,'0');
const clave = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const deClave = k => { const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); };
const masDias = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const corta = k => { const d=deClave(k); return `${DIAS[d.getDay()].slice(0,3)} ${d.getDate()}/${d.getMonth()+1}`; };
const larga = k => { const d=deClave(k); return `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`; };
const minutos = h => { const [a,b]=h.split(':').map(Number); return a*60+b; };
const ahoraMin = () => { const n=new Date(); return n.getHours()*60+n.getMinutes(); };
const hoyK = () => clave(new Date());
const idSes = (fecha,n) => `${fecha}_${n}`;

/* ═══════════════════════════ ALMACÉN ═══════════════════════════
   Todo se guarda en el propio móvil (localStorage). No sale a ningún
   servidor: la copia de seguridad se hace a mano, desde Exportar, y se
   manda a Drive, al correo o donde se quiera con el menú de compartir.  */
/* Programación de aula: NO va en el código (el repositorio es público). Se
   carga desde un archivo en Ajustes, se guarda en este móvil (store.programa)
   y viaja en la copia de seguridad. Formato: {tipo:'programacion-cuaderno',
   nombre, niveles:{1:[situaciones…], 2:[…]}}; ver «PROGRAMACIÓN DE AULA». */
const PROGD = () => (store.programa && store.programa.niveles) || {};
const unidadesProg = nv => (PROGD()[nv]||[]).map(sa=>({id:sa.id, nombre:sa.n, previstas:sa.it.reduce((a,x)=>a+x.s,0)}));
const recorta = (t,n) => t.length>n ? t.slice(0,n-1).replace(/\s+\S*$/,'')+'…' : t;
const LS = 'cuaderno-de-aula.v1';
const cfgInicial = () => ({
  inicio: hoyK(), docente:'', centro:'', curso:'2026-27', ultimaCopia:'',
  alumnos:{'1A':25,'1B':25,'1D':25,'2B':25,'R4':15},
  nolectivos:[], materiales:['Las piezas de Miut','Ficha 1','Ficha 2','Ficha 3','Ficha 4','Aules','Pizarra digital'],
  ultimaCopiaT:'', copia:{dia:5, hora:'14:10'},   // aviso de copia: el viernes al acabar la última clase
  borrados:[],                                     // rastro de los registros borrados
  // unidades o situaciones de aprendizaje, por nivel, con las sesiones previstas
  unidades:{1:[{id:'u1', nombre:'Divisibilidad · Las piezas de Miut', previstas:12}],
            2:[{id:'u1', nombre:'Divisibilidad · Las piezas de Miut', previstas:8}],
            4:[]},
});
const VERSION_APP = '1.8.0';
// CALENDARIO ESCOLAR 2026-27 del centro (días de lunes a viernes sin clase).
// Se cargan con un botón en Ajustes; después se pueden quitar uno a uno.
// Después del fin del periodo lectivo no se cuentan sesiones pendientes.
const CAL = {nombre:'calendario escolar 2026-27', fin:'2027-06-18', dias:[
  '2026-10-09','2026-10-12',                                   // 9 d'Octubre · Hispanitat
  '2026-12-08',                                                // Immaculada
  '2026-12-22','2026-12-23','2026-12-24','2026-12-25','2026-12-28','2026-12-29','2026-12-30','2026-12-31',
  '2027-01-01','2027-01-04','2027-01-05','2027-01-06',         // Nadal (22 des – 6 gen, en rosa en el calendario)
  '2027-03-01','2027-03-02','2027-03-03','2027-03-04','2027-03-05', // Magdalena
  '2027-03-19',                                                // Sant Josep
  '2027-03-25','2027-03-26','2027-03-29','2027-03-30','2027-03-31','2027-04-01','2027-04-02' // Pasqua
]};
let store = {cfg:cfgInicial(), ses:{}, ev:{}, prog:{}, programa:null};
const clon = o => JSON.parse(JSON.stringify(o));
function leerLocal(){
  try{
    const j = JSON.parse(localStorage.getItem(LS) || 'null');
    if(j && j.store){ store = j.store; const c0 = cfgInicial(); store.cfg = Object.assign(c0, store.cfg||{}); store.cfg.alumnos = Object.assign(cfgInicial().alumnos, store.cfg.alumnos||{}); }
    if(!store.cfg.unidades[4]) store.cfg.unidades[4] = [];
    if(!store.ev) store.ev = {};
    if(!store.prog) store.prog = {};
    // las unidades de antes (solo la de divisibilidad) pasan a ser las de la programación
    if(store.programa) ponerUnidadesProg(false);
  }catch(e){}
}
let avisado = false;
function guardarLocal(){
  try{ localStorage.setItem(LS, JSON.stringify({store})); }
  catch(e){ if(!avisado){ avisado = true; alert('El móvil no ha dejado guardar. Haz una copia de seguridad desde Exportar.'); } }
}
// Cada registro guarda cuándo se creó y un historial de qué campos se
// cambiaron y cuándo: es lo que pide una auditoría para fiarse de un
// registro que se puede editar.
const CAMPOS = ['estado','motivo','unidad','contenido','material','deberes','revisiones','clima','perdIni','perdFin','pt','ptNotas','cambio','observacion','notas','reconstruido','fuente'];
function guardarSesion(id, datos){
  const ahora = new Date().toISOString(), prev = store.ses[id];
  const hist = prev ? clon(prev.historial||[]) : [];
  if(prev){
    const c = CAMPOS.filter(k => JSON.stringify(prev[k]??'') !== JSON.stringify(datos[k]??''));
    if(!c.length) return false;
    hist.push({t:ahora, c});
  }
  datos.creado = prev ? (prev.creado || prev.actualizado || ahora) : ahora;
  datos.historial = hist.slice(-30);
  datos.actualizado = ahora;
  store.ses[id] = datos; guardarLocal(); return true;
}
function borrarSesion(id){
  const s = store.ses[id];
  if(s) store.cfg.borrados.push({id, grupo:s.grupo||s.otra, fecha:s.fecha, franja:s.franja, t:new Date().toISOString(),
    resumen:(s.contenido||s.motivo||s.notas||'').slice(0,80)});
  delete store.ses[id]; guardarLocal();
}
function guardarCfg(){ guardarLocal(); }

/* ── BORRADORES ──
   Lo que se escribe en una sesión se guarda solo, mientras se escribe, como
   borrador aparte. El registro oficial solo cambia al pulsar Guardar: así el
   historial de cambios (lo que mira una auditoría) no se llena de apuntes a
   medias, y a la vez no se pierde nada si suena el timbre, se cierra la hoja o
   el móvil mata la app. Los borradores no van en la copia de seguridad. */
const LSB = LS + '.borradores';
let borr = {ses:{}, abierto:null};
try{ const j = JSON.parse(localStorage.getItem(LSB)||'null'); if(j && j.ses) borr = j; }catch(e){}
function guardarBorr(){ try{ localStorage.setItem(LSB, JSON.stringify(borr)); }catch(e){} }
const mismos = (a,b) => CAMPOS.every(k => JSON.stringify(a[k]??'') === JSON.stringify(b[k]??''));
function quitarBorrador(id){ if(borr.ses[id]){ delete borr.ses[id]; guardarBorr(); } }
let instalable = null;
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); instalable = e; if(vista==='ajustes') pintar(); });
const instalada = () => window.matchMedia('(display-mode: standalone)').matches;
async function conectar(){
  // que el navegador no borre los datos si se queda sin espacio
  try{ if(navigator.storage && navigator.storage.persist) await navigator.storage.persist(); }catch(e){}
  if('serviceWorker' in navigator){ try{ await navigator.serviceWorker.register('sw.js'); }catch(e){} }
}

/* ═══════════════════════════ LÓGICA ═══════════════════════════ */
function esLectivo(k){
  const d = deClave(k), w = d.getDay();
  return w>=1 && w<=5 && k <= CAL.fin && !store.cfg.nolectivos.includes(k);
}
function franjasDe(k){
  const w = deClave(k).getDay();
  return HORARIO[w] || {};
}
function haTerminado(k,n){
  const h = hoyK();
  if(k < h) return true;
  if(k > h) return false;
  return ahoraMin() >= minutos(FR[n].fin);
}
function sinRegistrar(){
  const out = [];
  const hoy = hoyK();
  let d = deClave(store.cfg.inicio || hoy);

function indicadores(g, desde, hasta){

  let previstas = 0, conPT = 0;

  const pIni = conP.reduce((a,s)=>a+(Number(s.perdIni)||0),0), pFin = conP.reduce((a,s)=>a+(Number(s.perdFin)||0),0);

    mIni: conP.length ? Math.round(pIni/conP.length) : 0, mFin: conP.length ? Math.round(pFin/conP.length) : 0};
  const porUnidad = unidadesDe(g).map(u=>({...u, dadas: dadas.filter(s=>s.unidad===u.id).length}));
  const sinUnidad = dadas.filter(s=>!s.unidad).length;
  return {previstas, registradas: ses.filter(s=>s.fecha<=fin).length, dadas: dadas.length, noDadas: ses.length - dadas.length,
    sinRegistrar: sinRegistrar().filter(x=>x.g===g && x.k>=desde && x.k<=hasta).length,

    entrega: total ? Math.round(100*traen/total) : null, entregaMedias: total ? Math.round(100*medias/total) : null, clima, climaN: clima.bien+clima.regular+clima.mal,
    pt: pt.length, ptSi, porUnidad, sinUnidad, perd};

/* Fechas previstas: pruebas escritas, entregas… Una misma prueba puede tener
   una fecha distinta en cada grupo (los tres primeros no tienen clase el

const diasHasta = k => Math.round((deClave(k) - deClave(hoyK())) / 86400000);
// clases de un grupo que quedan antes de una fecha (sin contar las de hoy ya terminadas)
function clasesAntes(g, k){

  for(let d = deClave(hoyK()); clave(d) < k; d = masDias(d,1)){

}
function siguienteClase(g, desde){

  for(let i=0; i<90; i++, d = masDias(d,1)){
    const k = clave(d); if(!esLectivo(k)) continue;
    const h = franjasDe(k); for(const f in h) if(h[f].g===g) return k;
  }

function proximas(dias){
  const out = [];
  for(const [id,e] of Object.entries(store.ev||{})) for(const [g,k] of Object.entries(e.fechas||{})){
    const falta = diasHasta(k);
    if(falta>=0 && (dias===undefined || falta<=dias)) out.push({id, g, k, falta, tipo:e.tipo, titulo:e.titulo});
  }

/* ═══════════════════════ PROGRAMACIÓN DE AULA ═══════════════════════
   Las situaciones de aprendizaje de la programación de aula entregada al
   departamento (1.º y 2.º), cada una con sus actividades y sus sesiones.
   «ini» es cuándo empieza según la programación; el plan de cada grupo sale
   de repartir las sesiones en las clases de su horario, sin festivos. Lo que
   se marca como hecho se guarda por grupo en store.prog y va en la copia. */
function clasesEntre(g, k1, k2){
  const out = [];
  for(let d = deClave(k1); clave(d) < k2; d = masDias(d,1)){
    const k = clave(d); if(!esLectivo(k)) continue;
    const h = franjasDe(k); for(const f in h) if(h[f].g===g) out.push(k);
  }
  return out;
}
// las próximas n clases de un grupo, contando las de hoy que aún no han acabado
function proximasClases(g, n){
  const out = [];
  for(let d = deClave(hoyK()), i = 0; out.length < n && i < 400; d = masDias(d,1), i++){
    const k = clave(d); if(k > CAL.fin) break; if(!esLectivo(k)) continue;
    const h = franjasDe(k);
    for(const f of Object.keys(h).sort((a,b)=>a-b)) if(h[f].g===g && !haTerminado(k, Number(f))) out.push(k);
  }
  return out.slice(0, n);
}
const progDe = g => { const P = PROGD()[GRUPOS[g].nivel]; return P && P.length ? P : null; };
const hechos = g => (store.prog && store.prog[g]) || {};
let cachePlan = {};
function plan(g){
  const P = progDe(g); if(!P) return null;
  const firma = store.cfg.nolectivos.join(',') + hoyK();
  if(cachePlan[g] && cachePlan[g].firma===firma) return cachePlan[g];
  const seq = P.filter(s=>!s.trans), items = [];
  const finCurso = clave(masDias(deClave(CAL.fin),1));
  seq.forEach((sa, i)=>{
    const L = clasesEntre(g, sa.ini, i+1<seq.length ? seq[i+1].ini : finCurso);
    const N = sa.it.reduce((a,x)=>a+x.s, 0);
    const f = N ? L.length / N : 1;   // se reparte en todas las clases hasta la siguiente; si no caben, se aprietan
    let pos = 0, acc = 0;
    sa.it.forEach(it=>{
      acc += it.s * f;
      const hasta = Math.max(Math.round(acc), it.s ? pos+1 : pos);
      const fechas = L.slice(pos, hasta); pos = hasta;
      const ini = fechas[0] || L[L.length-1] || sa.ini, fin = fechas[fechas.length-1] || ini;
      items.push({sa, it, fechas, ini, fin});
    });
  });
  return (cachePlan[g] = {firma, items, apretadas: seq.filter((sa,i)=>
    sa.it.reduce((a,x)=>a+x.s,0) > clasesEntre(g, sa.ini, i+1<seq.length ? seq[i+1].ini : finCurso).length).map(s=>s.id)});
}
function estadoProg(g){
  const p = plan(g); if(!p) return null;
  const H = hechos(g), hoy = hoyK();
  let n = 0, hechosN = 0, sesHechas = 0, sesPrev = 0, sesTot = 0, prevN = 0;
  p.items.forEach(x=>{
    n++; sesTot += x.it.s;
    if(H[x.it.id]){ hechosN++; sesHechas += x.it.s; }
    if(x.fechas.length) sesPrev += x.it.s * x.fechas.filter(k=>k<hoy).length / x.fechas.length;
    if(x.fin < hoy) prevN++;
  });
  const sig = p.items.find(x=>!H[x.it.id]) || null;              // por dónde vas
  const toca = p.items.filter(x=>x.ini<=hoy && x.fin>=hoy);        // lo que dice el plan para hoy
  return {p, H, n, hechosN, prevN, sesTot, sesHechas, sesPrev:Math.round(sesPrev), retraso:Math.round(sesPrev - sesHechas), sig, toca};
}
// Horquilla para la prueba de una actividad: lo que queda hasta ella, contado
// en clases del grupo desde hoy, y un par de clases a cada lado.
function horquilla(g, item){
  const E = estadoProg(g); if(!E) return null;
  let quedan = 0;
  for(const x of E.p.items){ if(!E.H[x.it.id]) quedan += x.it.s; if(x.it.id===item.it.id) break; }
  if(!quedan) return null;
  const L = proximasClases(g, quedan + 2);
  if(!L.length) return null;
  const idx = Math.min(quedan, L.length) - 1;
  const opc = L.slice(Math.max(0, idx-1), idx+3);
  const corte = opc.some((k,i)=> i && (deClave(k)-deClave(opc[i-1]))/86400000 > 4);
  return {opc, prevista: L[idx], plan: item.fin, corte};
}

      <button class="bloque-btn" data-a="restaurar" style="margin-top:0">Restaurar una copia</button></div>`;
  }
  if(w===0 || w===6){
    return h + `<div class="vacio"><b>Fin de semana.</b><br>No hay clases en el horario.</div>`;
  }
  if(store.cfg.nolectivos.includes(dia)){
    return h + `<div class="vacio"><b>Día no lectivo.</b><br>Las sesiones de hoy no cuentan como pendientes.<br><br>
      <button class="chip" data-a="lectivo">Marcar como lectivo</button></div>`;
  }
  const hor = franjasDe(dia);
  h += '<ul class="franjas">';
  for(const f of FRANJAS){
    if(f.recreo){ h += `<li class="recreo">recreo</li>`; continue; }
    const x = hor[f.n];
    if(!x) continue;
    const id = idSes(dia,f.n), s = store.ses[id];
    const ahora = dia===hoyK() && ahoraMin()>=minutos(f.ini) && ahoraMin()<minutos(f.fin);
    if(x.g){
      const fx = fechasDe(x.g, dia).map(e=>`<span class="etq">${TIPOS[e.tipo]}</span>`).join('');
      let marca = '', sub = `Aula ${x.aula}${x.pt?'<span class="pt">con PT</span>':''}${fx}`;
      if(s && s.estado==='no'){ marca = `<span class="marca no">no impartida</span>`; sub = esc(s.motivo||''); }
      else if(s){ marca = `<span class="marca ok">✓ registrada</span>`; sub = esc(s.contenido || s.material || 'Sin descripción'); }
      if(borr.ses[id]){ marca = `<span class="marca borr">✎ borrador</span>`; }
      else if(!s && haTerminado(dia,f.n)){ marca = `<span class="marca pend">por registrar</span>`; }
      h += `<li><button class="fr${ahora?' ahora':''}" data-a="abrir" data-n="${f.n}">
        <span class="hora"><b>${f.ini}</b>${f.fin}</span>
        <span><span class="grupo" style="--gc:${gc(x.g)}">${GRUPOS[x.g].nombre}</span><div class="sub">${sub}</div></span>
        ${marca}</button></li>`;
    }else{
      const marca = borr.ses[id] ? `<span class="marca borr">✎ borrador</span>` : s ? `<span class="marca ok">✓ anotada</span>` : '';
      const sub = s && s.notas ? esc(s.notas) : 'Toca para anotar';
      h += `<li><button class="fr otra${ahora?' ahora':''}" data-a="abrir" data-n="${f.n}">
        <span class="hora"><b>${f.ini}</b>${f.fin}</span>
        <span><span class="grupo" style="--gc:var(--gX)">${OTRAS[x.o]}</span><div class="sub">${sub}</div></span>
        ${marca}</button></li>`;
    }
  }
  h += '</ul>';
  if(!Object.keys(hor).length) h += `<div class="vacio">Hoy no tienes nada en el horario.</div>`;
  h += vSemana();
  h += `<p class="nota" style="margin-top:14px"><button class="chip" data-a="nolectivo">Marcar el día como no lectivo</button></p>`;
  return h;
}

/* ── Programación: el bloque de Grupos y la semana del Día ── */
function vProg(g){
  const E = estadoProg(g);
  if(!E) return GRUPOS[g].nivel===4
    ? `<h3>Programación</h3><p class="leyenda">El taller no sigue una secuencia de temas: cada alumno trabaja lo de su clase y su itinerario de fichas.</p>`
    : `<h3>Programación</h3><p class="leyenda">Carga el archivo de tu programación en <b>Ajustes</b> para ver aquí el seguimiento, las fechas de las pruebas y lo que toca cada semana.</p>`;
  const P = progDe(g), I = indicadores(g, store.cfg.inicio, hoyK());
  const dadasU = Object.fromEntries(I.porUnidad.map(u=>[u.id, u.dadas]));
  const r = E.retraso, sem = Math.round(Math.abs(r)/4*2)/2;
  const ritmo = Math.abs(r) <= 1 ? 'vas al día'
    : r > 0 ? `vas ${r} ${r===1?'clase':'clases'} por detrás${sem>=1?' (≈ '+String(sem).replace('.',',')+' '+(sem===1?'semana':'semanas')+')':''}`
    : `vas ${-r} ${r===-1?'clase':'clases'} por delante`;
  let h = `<h3>Programación</h3>
    <div class="pbar" role="img" aria-label="Hechas ${E.hechosN} de ${E.n} actividades; según el plan, ${E.prevN}">
      <span style="width:${pct(E.sesHechas,E.sesTot)}%"></span><i style="left:${pct(E.sesPrev,E.sesTot)}%"></i></div>
    <p class="leyenda">${E.hechosN} de ${E.n} actividades hechas · según el plan deberías ir por ${E.prevN} · <b class="${r>3?'tarde':''}">${ritmo}</b>.
      La raya roja es donde dice el plan que deberías estar hoy.</p>
    ${E.prevN > E.hechosN ? `<p class="nota"><button class="chip" data-a="pi-hasta" data-g="${g}">Marcar como hecho todo lo que el plan daba hasta hoy</button><br>
      Útil al empezar a usarlo; lo que no se haya dado se desmarca uno a uno.</p>` : ''}`;
  const blq = (sa, abierto) => {
    const its = E.p.items.filter(x=>x.sa===sa);
    const hn = its.filter(x=>E.H[x.it.id]).length, todo = hn===its.length;
    const ses = its.reduce((a,x)=>a+x.it.s,0), d = dadasU[sa.id];
    let b = `<details class="sa${todo?' hecha':''}" ${abierto?'open':''}><summary><span class="sa-n">${todo?'✓ ':''}${esc(sa.n)}</span>
      <span class="sa-c">${hn}/${its.length} · ${rangoCorto(its[0].ini, its[its.length-1].fin)}</span>
      <span class="prog"><span style="width:${pct(hn,its.length)}%"></span></span></summary>
      <p class="leyenda" style="margin:6px 0 2px">${esc(sa.u)}${d!==undefined?` · ${d} ${d===1?'sesión registrada':'sesiones registradas'} de ${ses} previstas`:''}</p>
      ${E.p.apretadas.includes(sa.id)?'<p class="leyenda tarde">Con el calendario, las sesiones previstas no caben antes de la siguiente: el plan las aprieta.</p>':''}
      <ul class="pasos">`;
    its.forEach(x=>{
      const ok = !!E.H[x.it.id];
      b += `<li><button class="paso-b" data-a="pi" data-g="${g}" data-i="${x.it.id}" aria-pressed="${ok}">
        <span class="caja" aria-hidden="true">${ok?'✓':''}</span>
        <span class="txt">${esc(x.it.a)}<small>${x.it.s} ${x.it.s===1?'sesión':'sesiones'} · ${rangoCorto(x.ini, x.fin)}${ok?' · hecho el '+corta(E.H[x.it.id]):''}</small></span>
        ${x.it.ex?'<span class="etq">Prueba</span>':''}</button>`;
      if(x.it.ex && !ok){
        const fj = pruebaFijada(g, sa.id);
        if(fj) b += `<div class="horq">Prueba fijada: <button class="chip" data-a="ir-fecha" data-id="${fj[0]}">${larga(fj[1].fechas[g])}</button></div>`;
        else{
          const hq = horquilla(g, x);
          if(hq) b += `<div class="horq"><span>Para la prueba, a tu ritmo:</span>
            ${hq.opc.map(k=>`<button class="chip${k===hq.prevista?' sel':''}" data-a="px" data-g="${g}" data-sa="${sa.id}" data-k="${k}">${corta(k)}</button>`).join('')}
            <small>El plan la ponía hacia el ${corta(hq.plan)}.${hq.corte?' Ojo: hay vacaciones o festivos en medio.':''} Toca una fecha para apuntarla en Fechas.</small></div>`;
        }
      }
      b += `</li>`;
    });
    return b + `</ul></details>`;
  };
  const actual = E.sig ? E.sig.sa : null;
  P.filter(s=>!s.trans).forEach(sa=>{ h += blq(sa, sa===actual); });
  const tr = P.find(s=>s.trans);
  if(tr){
    h += `<details class="sa"><summary><span class="sa-n">${esc(tr.n)}</span><span class="sa-c">a lo largo del curso</span></summary>
      <p class="leyenda" style="margin:6px 0 2px">${esc(tr.u)}</p><ul class="pasos">${tr.it.map(it=>{ const ok = !!E.H[it.id];
      return `<li><button class="paso-b" data-a="pi" data-g="${g}" data-i="${it.id}" aria-pressed="${ok}"><span class="caja" aria-hidden="true">${ok?'✓':''}</span>
        <span class="txt">${esc(it.a)}${ok?'<small>hecho el '+corta(E.H[it.id])+'</small>':''}</span></button></li>`; }).join('')}</ul></details>`;
  }
  return h;
}
function vSemana(){
  const [l, v] = semanaDe(dia), hoy = hoyK();
  const filas = [];
  for(const g of Object.keys(GRUPOS)){
    const E = estadoProg(g); if(!E) continue;
    const L = clasesEntre(g, l, clave(masDias(deClave(v),1)));
    if(!L.length) continue;
    const toca = E.p.items.filter(x=>x.fechas.some(k=>k>=l && k<=v));
    const sas = [...new Set(toca.map(x=>x.sa))];
    let t = toca.length ? `<b>${sas.map(s=>esc(s.n)).join(' · ')}</b> — ${toca.map(x=>esc(recorta(x.it.a,110))).join(' · ')}` : 'Sin actividad prevista en el plan';
    let extra = '';
    if(E.sig && l<=hoy && hoy<=v && !toca.some(x=>x===E.sig)) extra = `<small class="${E.retraso>3?'tarde':''}">Vas por: ${esc(E.sig.sa.n)} — ${esc(recorta(E.sig.it.a,90))}</small>`;
    const px = toca.find(x=>x.it.ex);
    if(px) extra += `<small>Según el plan, esta semana cae la prueba.</small>`;
    filas.push(`<li><button data-a="ir-grupo" data-g="${g}"><span class="grupo" style="--gc:${gc(g)}">${GRUPOS[g].nombre.replace(' ESO','')}</span>
      <span class="sem-t">${t}${extra}</span></button></li>`);
  }
  if(!filas.length) return '';
  return `<details class="semana" open><summary>La semana del ${rangoCorto(l, v)}, según la programación</summary><ul>${filas.join('')}</ul></details>`;
}

/* ── PLANO DEL AULA ── Para revisar deberes sin saberse aún los nombres: se
   toca la mesa de quien no los trae y la app apunta su número de lista. El
   plano solo guarda números por mesa (nada de nombres) y va en la copia. */
// Un plano por grupo (clave «1A») y, si un aula es distinta, otro para esa aula («1A@A104»).
const clavePlano = (g, aula) => aula ? `${g}@${aula}` : g;
const planoLleno = k => { const p = (store.cfg.planos||{})[k]; return p && Object.keys(p.sitios||{}).length ? p : null; };
const planoDe = (g, aula) => (aula && planoLleno(clavePlano(g, aula))) || planoLleno(g);
const aulasDe = g => [...new Set(Object.values(HORARIO).flatMap(d=>Object.values(d)).filter(x=>x.g===g && x.aula).map(x=>x.aula))].sort();
let planoB = null, planoG = null, planoA = '';
function abrirPlano(g, aula){ planoG = g; planoA = aula || '';
  planoB = clon((store.cfg.planos||{})[clavePlano(g, planoA)] || (planoA && planoLleno(g) ? {...planoLleno(g)} : null) || {filas:5, cols:6, sitios:{}});
  vista = 'plano'; pintar(); window.scrollTo(0,0); }
function rejillaPlano(p, celda, cls){
  let h = `<div class="pizarra">pizarra</div><div class="plano${cls?' '+cls:''}" style="grid-template-columns:repeat(${p.cols},1fr)">`;
  for(let f=1; f<=p.filas; f++) for(let c=1; c<=p.cols; c++) h += celda(`${f}-${c}`, p.sitios[`${f}-${c}`]);
  return h + `</div>`;
}
function vPlanoEd(){
  const p = planoB, N = store.cfg.alumnos[planoG] || 25, usados = new Set(Object.values(p.sitios));
  let sig = 1; while(usados.has(sig) && sig <= N) sig++;
  const faltan = []; for(let i=1;i<=N;i++) if(!usados.has(i)) faltan.push(i);
  let h = `<h1 class="titulo">Plano del aula</h1>
    <p><span class="grupo" style="--gc:${gc(planoG)}">${GRUPOS[planoG].nombre}</span> · ${planoA ? 'aula '+esc(planoA) : 'todas las aulas'}</p>
    ${planoA ? `<p class="nota">Este plano solo se usa en el aula ${esc(planoA)}; en las demás, el general. Empieza como copia del general.</p>` : ''}
    <p class="nota">Con el plano de clase delante, toca la mesa del <b>1</b>, luego la del <b>2</b>, y así. Si te equivocas, toca esa mesa otra vez y se vacía: el número vuelve a ser el siguiente.</p>
    <div class="plano-ctl"><span>Filas</span><button class="btn-r" data-pz="filas" data-d="-1">−</button><b>${p.filas}</b><button class="btn-r" data-pz="filas" data-d="1">+</button>
      <span>Columnas</span><button class="btn-r" data-pz="cols" data-d="-1">−</button><b>${p.cols}</b><button class="btn-r" data-pz="cols" data-d="1">+</button></div>
    <p class="plano-sig">${sig<=N?`Siguiente: <b>${sig}</b>`:'Están todos colocados.'}</p>`;
  h += rejillaPlano(p, (k,n)=>`<button class="mesa${n?' llena':''}" data-pz="mesa" data-k="${k}">${n||''}</button>`);

function accionPlano(a, b){
  const p = planoB, N = store.cfg.alumnos[planoG] || 25;
  if(a==='filas' || a==='cols'){
    p[a] = Math.max(1, Math.min(10, p[a] + Number(b.dataset.d)));
    for(const k of Object.keys(p.sitios)){ const [f,c] = k.split('-').map(Number); if(f>p.filas || c>p.cols) delete p.sitios[k]; }
  }
  else if(a==='mesa'){
    const k = b.dataset.k;
    if(p.sitios[k]) delete p.sitios[k];
    else{ const u = new Set(Object.values(p.sitios)); let sig = 1; while(u.has(sig)) sig++; if(sig > N){ toast('Ya están todos colocados'); return; } p.sitios[k] = sig; }
  }
  else if(a==='vaciar'){ if(!confirm('¿Vaciar todas las mesas?')) return; p.sitios = {}; }
  else if(a==='borrar'){ if(!confirm(`¿Borrar el plano del aula ${planoA}? Se usará el general.`)) return;
    delete store.cfg.planos[clavePlano(planoG, planoA)]; guardarCfg(); planoB = null; vista = 'grupos'; pintar(); return; }
  else if(a==='cancelar'){ planoB = null; vista = 'grupos'; pintar(); return; }
  else if(a==='guardar'){
    store.cfg.planos = store.cfg.planos || {}; store.cfg.planos[clavePlano(planoG, planoA)] = p; guardarCfg();
    planoB = null; vista = 'grupos'; toast('Plano guardado'); pintar(); window.scrollTo(0,0); return;
  }
  const y = window.scrollY; pintar(); window.scrollTo(0,y);
}

/* ═══════════════════════════ LA HOJA DE UNA SESIÓN ═══════════════════════════ */
let borrador = null, abiertoId = null, base = null, recuperado = null, tBorr = null;
function abrir(k, n){
  const x = (franjasDe(k))[n];
  if(!x) return;
  abiertoId = idSes(k,n);
  const s = store.ses[abiertoId];
  borrador = s ? clon(s) : {
    fecha:k, franja:n, grupo:x.g||null, otra:x.o||null, aula:x.aula||'',
    estado:'si', motivo:'', contenido:'', material:'', deberes:'', revisiones:[], clima:'', perdIni:'', perdFin:'', cambio:'', observacion:'', notas:'',
    ...(x.pt ? {pt:'si', ptNotas:''} : {}),
    unidad: x.g ? ultimaUnidad(x.g) : '',
    // una sesión de hace dos días o más se está reconstruyendo después
    reconstruido: diasHasta(k) <= -2, fuente:''
  };
  if(x.pt && borrador.pt===undefined){ borrador.pt='si'; borrador.ptNotas=''; }
  base = clon(borrador); recuperado = null;
  const d = borr.ses[abiertoId];
  if(d && !mismos(d.b, base)){
    recuperado = {t:d.t, cambiado:(d.base||null)!==(s?s.actualizado:null)};
    borrador = Object.assign(clon(base), clon(d.b));
  }
  borr.abierto = abiertoId; guardarBorr();
  pintarHoja();
  $('#velo').classList.add('abierto'); $('#hoja').classList.add('abierta');
  document.body.style.overflow='hidden';
  setTimeout(()=>{ const t = $('#hoja textarea'); if(t && !s && !recuperado) t.focus(); }, 250);
}
// Guarda (o quita) el borrador de la sesión abierta. Si lo escrito coincide con
// lo ya registrado —o con la hoja en blanco—, no hay borrador que guardar.
function guardarBorrador(){
  if(!borrador || !abiertoId || !borrador.fecha || !base) return false;
  if($('#hoja [data-f]')) leerCampos();
  const ref = store.ses[abiertoId] || base;
  if(mismos(borrador, ref)){ quitarBorrador(abiertoId); return false; }
  const s = store.ses[abiertoId];
  borr.ses[abiertoId] = {b:clon(borrador), t:new Date().toISOString(), base: s ? s.actualizado : null};
  guardarBorr(); return true;
}
function borradorLuego(){ clearTimeout(tBorr); tBorr = setTimeout(guardarBorrador, 500); }
function cerrar(){
  clearTimeout(tBorr);
  const quedo = guardarBorrador();
  if(borr.abierto){ borr.abierto = null; guardarBorr(); }
  if(quedo) toast('Guardado como borrador: aún no está registrado');
  base = null; recuperado = null;
  $('#velo').classList.remove('abierto'); $('#hoja').classList.remove('abierta');
  document.body.style.overflow=''; borrador=null; abiertoId=null;
  setTimeout(()=>{ if(!borrador) $('#hoja').innerHTML=''; }, 260);
}
function pintarHoja(){
  const b = borrador, f = FR[b.franja];
  const titulo = b.grupo ? GRUPOS[b.grupo].nombre : OTRAS[b.otra];
  let h = `<div class="hoja-in"><div class="hoja-cab"><div>
      <h2 id="hoja-titulo"><span class="grupo" style="--gc:${b.grupo?gc(b.grupo):'var(--gX)'}">${titulo}</span></h2>
      <div class="quando">${larga(b.fecha)} · ${f.ini}–${f.fin}${b.aula?' · '+b.aula:''}${b.pt?' · con PT':''}</div></div>
      <button class="cerrar" data-h="cerrar">Cerrar</button></div>`;
  if(recuperado){
    h += `<div class="recuperado">✎ <b>Borrador recuperado</b> (${fechaHora(recuperado.t)}). Aún no está registrado: revísalo y pulsa Guardar.
      ${recuperado.cambiado?'<small>Ojo: el registro guardado de esta sesión ha cambiado después de escribir el borrador.</small>':''}
      <button class="secundario" data-h="descartar">Descartar borrador</button></div>`;

// Con el menú de compartir de Android se puede mandar a Drive, al correo…;
// si el navegador no lo permite, se descarga en la carpeta de Descargas.
async function descargar(nombre, datos, tipo){
  const f = new File([datos], nombre, {type:tipo});
  if(navigator.canShare && navigator.canShare({files:[f]})){
    try{ await navigator.share({files:[f], title:nombre}); toast('Enviado'); return true; }
    catch(e){ if(e && e.name==='AbortError'){ toast('Cancelado'); return false; } }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(f); a.download = nombre; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast('Descargado en Descargas'); return true;
}
async function copiaSeguridad(){
  // .txt porque Android no deja compartir archivos .json; dentro va el cuaderno entero
  const ok = await descargar(`cuaderno-de-aula_copia_${hoyK()}.txt`, JSON.stringify({version:1, store}, null, 1), 'text/plain');
  if(ok){ store.cfg.ultimaCopia = hoyK(); store.cfg.ultimaCopiaT = new Date().toISOString(); guardarLocal(); pintar(); }
}
function filasExport(){
  const desde = $('#ex-desde').value, hasta = $('#ex-hasta').value;
  const sel = [...document.querySelectorAll('.ex-g:checked')].map(i=>i.value);
  return Object.entries(store.ses)
    .filter(([id,s])=> s.fecha>=desde && s.fecha<=hasta && (s.grupo ? sel.includes(s.grupo) : sel.includes('otras')))
    .sort((a,b)=>a[0]<b[0]?-1:1).map(([id,s])=>({id,...s}));
}
const perdTxt = s => { const a = s.perdIni!==undefined && s.perdIni!=='', b = s.perdFin!==undefined && s.perdFin!=='';
  return a||b ? `perdidos ${a?s.perdIni:'?'} + ${b?s.perdFin:'?'} min` : ''; };
const textoRev = s => (s.revisiones||[]).map(r=>{
  const o = store.ses[r.de]; return `Deberes del ${o?corta(o.fecha):corta(r.de.split('_')[0])} (nº de lista): ${revTxt(r)}`;
}).join('; ');
function csv(){
  const f = filasExport();
  const cab = ['Fecha','Día','Hora','Grupo','Aula','Impartida','Motivo','Unidad','Qué se ha hecho','Material','Deberes puestos','Revisión de deberes','Clima del aula','Min. perdidos al empezar','Min. perdidos al acabar','PT en el aula','Trabajo con la PT','Cambio respecto al grupo anterior','Observación','Notas','Registrado el','Última modificación','Cambios','Reconstruido','A partir de'];
  const q = v => `"${String(v??'').replace(/"/g,'""')}"`;
  const filas = f.map(s=>[s.fecha, DIAS[deClave(s.fecha).getDay()], `${FR[s.franja].ini}-${FR[s.franja].fin}`,
    s.grupo?GRUPOS[s.grupo].nombre:OTRAS[s.otra], s.aula||'', s.grupo?(s.estado==='no'?'No':'Sí'):'', s.motivo||'', s.grupo?nombreUnidad(s.grupo,s.unidad):'',
    s.contenido||'', s.material||'', s.deberes||'', textoRev(s), s.clima?CLIMA[s.clima]:'', s.perdIni??'', s.perdFin??'', s.pt?(s.pt==='no'?'No ha venido':'Sí'):'', s.pt&&s.pt!=='no'?(s.ptNotas||''):'', s.cambio||'', s.observacion||'', s.notas||'', fechaHora(s.creado||s.actualizado), fechaHora(s.actualizado), (s.historial||[]).length, s.reconstruido?'Sí':'', s.reconstruido?(s.fuente||''):''].map(q).join(';'));
  return '\ufeff' + [cab.map(q).join(';'), ...filas].join('\r\n');
}
function calendarioInforme(desde, hasta, gs){
  const filas = [];
  for(const [id,e] of Object.entries(store.ev||{})) for(const [g,k] of Object.entries(e.fechas||{}))
    if(gs.includes(g) && k>=desde && k<=hasta) filas.push({g,k,e});
  if(!filas.length) return '';
  filas.sort((a,b)=>a.k<b.k?-1:1);
  return `<h2>Calendario de pruebas y entregas</h2><table><thead><tr><th>Fecha</th><th>Grupo</th><th>Tipo</th><th>Qué</th><th>Fijada el</th></tr></thead><tbody>
    ${filas.map(x=>`<tr><td>${corta(x.k)}</td><td>${GRUPOS[x.g].nombre}</td><td>${TIPOS[x.e.tipo]}</td><td>${esc(x.e.titulo)}${x.e.notas?`<div class="mat">${esc(x.e.notas)}</div>`:''}</td><td class="reg">${fechaHora(x.e.creado)}</td></tr>`).join('')}
  </tbody></table>`;
}

  const f = filasExport(), c = store.cfg;

    <th>Sin registrar</th><th>Entrega de deberes</th><th>Clima: bien / a ratos / no</th><th>Min. perdidos por sesión (inicio + final)</th><th>Con PT</th></tr></thead><tbody>`;

    «Entrega de deberes»: porcentaje del alumnado presente que los trae completos (y a medias), sobre las revisiones registradas; los ausentes no cuentan.</p>`;
  // 2. clima por franja horaria
  const cf = climaPorFranja(desde, hasta);
  const hayClima = Object.values(cf).some(x=>x.bien+x.regular+x.mal);
  if(hayClima){
    resumen += `<h2>Clima del aula por franja horaria</h2><table><thead><tr><th>Franja</th><th>Sesiones</th><th>Se ha podido trabajar</th><th>A ratos</th><th>No se ha podido</th></tr></thead><tbody>`;

    resumen += `</tbody></table>`;
  }
  const pf = perdidoPorFranja(desde, hasta);

    for(const n of [1,2,3,4,5,6]){ const x = pf[n]; if(!x.n) continue; const a = Math.round(x.ini/x.n), b = Math.round(x.fin/x.n);
      resumen += `<tr><td>${FR[n].ini}–${FR[n].fin}</td><td>${x.n}</td><td>${a} min</td><td>${b} min</td><td>${Math.max(0,DUR-a-b)} min</td></tr>`; }

// Excel en español guarda el CSV en Windows-1252 salvo que se elija «CSV UTF-8»: se prueban los dos.
document.getElementById('archivo-nombres').addEventListener('change', e=>{
  const f = e.target.files && e.target.files[0]; if(!f) return;
  const r = new FileReader(); r.onerror = ()=> toast('No se ha podido leer el archivo');
  r.onload = ()=>{
    e.target.value = '';
    let txt; try{ txt = new TextDecoder('utf-8',{fatal:true}).decode(r.result); }
    catch(err){ txt = new TextDecoder('windows-1252').decode(r.result); }
    const L = leerNombres(txt);
    if(!L){ toast('No he encontrado filas «grupo; número; nombre»'); return; }
    NOMBRES = L.out; NOMBRES_DE = f.name;
    const gs = Object.keys(L.out).map(g=>GRUPOS[g].nombre).join(', ');
    toast(`${L.n} nombres (${gs})${L.malas>1?` · ${L.malas} filas sin leer`:''}`);
    if($('#hoja').classList.contains('abierta')) pintarHoja(); else pintar();
  };
  r.readAsArrayBuffer(f);
});

let copiaPendiente = null;
document.getElementById('archivo-copia').addEventListener('change', e=>{

    const pisa = ids.filter(id=>store.ses[id]).length;
    const f1 = n ? j.store.ses[ids[0]].fecha : '', f2 = n ? j.store.ses[ids[n-1]].fecha : '';
    const nev = Object.keys(j.store.ev||{}).length;
    $('#hoja').innerHTML = `<div class="hoja-in"><div class="hoja-cab"><div><h2 id="hoja-titulo">Restaurar una copia</h2>
      <div class="quando">${esc(f.name)}</div></div><button class="cerrar" data-r="no">Cerrar</button></div>
      <div class="panel" style="margin-top:14px"><p><b>La copia trae ${n} ${n===1?'sesión':'sesiones'}</b>${n?` (del ${corta(f1)} al ${corta(f2)})`:''}${nev?` y ${nev} ${nev===1?'fecha':'fechas'} de pruebas o entregas`:''}.</p>
      <p class="nota">${pisa?`${pisa} ${pisa===1?'está':'están'} también en este móvil: se quedará la versión de la copia.`:'Ninguna está en este móvil: se añaden todas.'}
      Las sesiones que solo estén en este móvil no se tocan.</p></div>
      </div><div class="acciones"><div><button class="secundario" data-r="no">Cancelar</button>
      <button class="primario" data-r="si">Restaurar</button></div></div>`;

  };
  r.readAsText(f);
});

  let h = `<div class="hoja-in"><div class="hoja-cab"><div><h2 id="hoja-titulo">Sin registrar</h2>
    <div class="quando">${lista.length} ${lista.length===1?'sesión':'sesiones'} desde el ${larga(store.cfg.inicio)}</div></div>
    <button class="cerrar" data-f2="cerrar">Cerrar</button></div><ul class="hist" style="margin-top:12px">`;
  for(const x of [...lista].reverse()){
    h += `<li><button data-f2="ir" data-k="${x.k}" data-n="${x.n}"><div class="f">${larga(x.k)} · ${FR[x.n].ini}</div>
      <p class="c"><span class="grupo" style="--gc:${gc(x.g)}">${GRUPOS[x.g].nombre}</span></p></button></li>`;
  }
  h += `</ul><p class="nota">Si un día fue festivo, márcalo como no lectivo desde Día o Ajustes y dejará de salir aquí.</p></div>`;
  $('#hoja').innerHTML = h;
  $('#velo').classList.add('abierto'); $('#hoja').classList.add('abierta'); document.body.style.overflow='hidden';
}
document.getElementById('hoja').addEventListener('click', e=>{
  const b = e.target.closest('[data-f2]'); if(!b) return;
  if(b.dataset.f2==='cerrar'){ cerrar(); return; }
  const k = b.dataset.k, n = Number(b.dataset.n);
  dia = k; vista='dia'; pintar(); abrir(k, n);
});
document.getElementById('hoja').addEventListener('click', ev=>{
  const b = ev.target.closest('[data-e]'); if(!b || !evBorr) return;
  const a = b.dataset.e; leerFecha();
  if(a==='cerrar'){ evBorr=null; cerrar(); return; }
  if(a==='tipo') evBorr.tipo = b.dataset.v;
  else if(a==='grupo'){
    const g = b.dataset.g;
    if(evBorr.fechas[g]) delete evBorr.fechas[g];
    else evBorr.fechas[g] = siguienteClase(g, clave(masDias(deClave(hoyK()), 7)));
  }
  else if(a==='guardar'){
    if(!evBorr.titulo.trim()){ toast('Escribe qué es'); return; }
    if(!Object.keys(evBorr.fechas).length){ toast('Elige al menos un grupo'); return; }
    const ahora = new Date().toISOString(), prev = store.ev[evId];
    evBorr.creado = prev ? (prev.creado||ahora) : ahora; evBorr.actualizado = ahora;
    store.ev[evId] = clon(evBorr); guardarLocal(); evBorr = null; cerrar(); toast('Fecha guardada'); pintar(); return;
  }
  else if(a==='borrar'){
    if(confirm('¿Borrar esta fecha?')){ delete store.ev[evId]; guardarLocal(); evBorr=null; cerrar(); toast('Fecha borrada'); pintar(); }
    return;
  }
  pintarHojaFecha();
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && $('#hoja').classList.contains('abierta')) cerrar(); });
// al volver a la app (cambio de pestaña o de hora) se repinta: la franja «ahora» se mueve sola
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ clearTimeout(tBorr); guardarBorrador(); tOculto = Date.now(); return; }
  if(NOMBRES && tOculto && Date.now() - tOculto > 20*60000){
    olvidarNombres('Nombres olvidados tras 20 minutos fuera de la app');
    if($('#hoja').classList.contains('abierta')) pintarHoja();
  }
  if(!borrador && !copiaPendiente) pintar();
});
window.addEventListener('pagehide', ()=>{ clearTimeout(tBorr); guardarBorrador(); });
setInterval(()=>{ if(!borrador && !copiaPendiente && vista==='dia') pintar(); }, 60000);

/* ═══════════════════════════ ARRANQUE ═══════════════════════════ */
leerLocal();
if(!esLectivo(dia) && [0,6].includes(deClave(dia).getDay())){
  let d = deClave(dia); while(d.getDay()===0||d.getDay()===6) d = masDias(d,1); dia = clave(d);
}
pintar();
// si el móvil cerró la app con una hoja abierta, se vuelve a ella tal como estaba
if(borr.abierto && borr.ses[borr.abierto]){
  const d = borr.ses[borr.abierto].b;
  if(d && d.fecha && franjasDe(d.fecha)[d.franja]){ dia = d.fecha; vista = 'dia'; pintar(); abrir(d.fecha, d.franja); }
}else if(borr.abierto){ borr.abierto = null; guardarBorr(); }
conectar();
</script>
</body>
</html>
